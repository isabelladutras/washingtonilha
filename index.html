<style>
:root {
  color-scheme: light;
  --bg: #eef2f6;
  --card: #ffffff;
  --ink: #122233;
  --ink-2: #4b5c6b;
  --ink-3: #6e7e8c;
  --line: #d6dee6;
  --line-2: #e7edf2;
  --rail: #0a2f4b;
  --rail-ink: #d7e6f0;
  --brand: #1565c0;
  --brand-strong: #0a4680;
  --brand-soft: #dde9fb;
  --erro: #b42318;
  --erro-soft: #fde7e4;
  --warn: #8a5300;
  --warn-soft: #fff0cf;
  --ok: #1b7a46;
  --ok-soft: #dcf2e4;
  --neutro-soft: #eceff2;
  --radius: 10px;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 0.9375rem/1.5 var(--font-body);
  display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100vh;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.15rem; margin-bottom: 0.6rem; }
h3 { font-size: 1rem; margin-bottom: 0.4rem; }
p { margin: 0 0 0.6rem; }
a { color: var(--brand-strong); }
button { font: inherit; color: inherit; cursor: pointer; }
ul { margin: 0; padding-left: 1.2rem; }
:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-2); }

/* Navegação */
.rail { background: var(--rail); color: var(--rail-ink); padding: 1.4rem 1rem; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 1.4rem; overflow-y: auto; }
#nav { flex-shrink: 0; }
.rodape { flex-shrink: 0; }
.marca { display: flex; flex-direction: column; gap: 0.15rem; padding: 0 0.5rem; }
.marca b { font: 800 1.3rem/1 var(--font-display); color: #fff; }
.marca span { font-size: 0.8125rem; opacity: 0.8; }
#nav { display: flex; flex-direction: column; gap: 0.15rem; }
.nav-item { display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0.6rem; border-radius: 8px; text-decoration: none; color: var(--rail-ink); font-weight: 500; background: none; border: 0; text-align: left; width: 100%; }
.nav-item:hover { background: rgba(255, 255, 255, 0.08); }
.nav-item.on { background: #fff; color: var(--rail); font-weight: 700; }
.nav-item svg { width: 1.15rem; height: 1.15rem; flex: none; }
.rail .rodape { margin-top: auto; font-size: 0.75rem; opacity: 0.75; padding: 0 0.5rem; }

main { padding: 1.6rem clamp(1rem, 3vw, 2.4rem) 3rem; min-width: 0; max-width: 88rem; }
.topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.8rem 1.5rem; margin-bottom: 1.2rem; }
.topo-acoes { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.subtitulo { margin: 1.4rem 0 0.7rem; }
.stats-topo { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.stat-tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.7rem 1.1rem; display: flex; flex-direction: column; gap: 0.1rem; min-width: 8rem; }
.stat-tile b { font: 800 1.5rem/1 var(--font-display); color: var(--rail); }
.stat-tile span { font-size: 0.78rem; color: var(--ink-2); }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid var(--line); background: var(--card); padding: 0.45rem 0.85rem; border-radius: 8px; font-weight: 600; text-decoration: none; color: var(--ink); line-height: 1.2; }
.btn:hover { border-color: var(--ink-3); }
.btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.on-erro { background: var(--erro); border-color: var(--erro); color: #fff; }
.btn.on-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.sm { padding: 0.3rem 0.6rem; font-size: 0.8125rem; }
.link { background: none; border: 0; padding: 0; color: var(--brand-strong); text-decoration: underline; font-weight: 600; }
label { display: block; font-weight: 600; font-size: 0.8125rem; margin-bottom: 0.25rem; }

  const DIAS_FULL = { SEG: 'Segunda', TER: 'Terça', QUA: 'Quarta', QUI: 'Quinta', SEX: 'Sexta', 'SÁB': 'Sábado', DOM: 'Domingo' };

  function norm(s) {
    return String(s || '').normalize('NFD').replace(/\p{Mark}/gu, '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  /** "SEG/QUA" -> ["SEG","QUA"], "TER/QUI" -> ["TER","QUI"], "SÁB" -> ["SÁB"] etc. */
  function diasDaTurma(diaTxt) {
    return String(diaTxt || '').split('/').map(function (s) { return s.trim().toUpperCase(); }).filter(Boolean);
  }

  /** Extrai [horaIni, horaFim] em minutos desde meia-noite, a partir de "18h - 19h" / "9:45h - 11h" etc. */
  function horarioMin(horarioTxt) {
    const partes = String(horarioTxt || '').split('-');
    if (partes.length < 2) return null;
    function paraMin(txt) {
      const m = txt.match(/(\d{1,2})(?::(\d{2}))?/);
      if (!m) return null;
      return parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
    }
    const ini = paraMin(partes[0]), fim = paraMin(partes[1]);
    if (ini == null || fim == null) return null;
    return [ini, fim];
  }

  function horariosSeSobrepoem(h1, h2) {
    if (!h1 || !h2) return false;
    return h1[0] < h2[1] && h2[0] < h1[1];
  }

  /** Lista de turmas agrupadas por dia da semana, na ordem SEG..DOM, prontas pra grade semanal. */
  function gradeSemanal(turmas) {
    const porDia = {};
    DIAS_ORDEM.forEach(function (d) { porDia[d] = []; });
    turmas.forEach(function (t) {
      diasDaTurma(t.dia).forEach(function (d) {
        if (!porDia[d]) porDia[d] = [];
        porDia[d].push(t);
      });
    });
    DIAS_ORDEM.forEach(function (d) {
      porDia[d].sort(function (a, b) {
        const ha = horarioMin(a.horario), hb = horarioMin(b.horario);
        return (ha ? ha[0] : 0) - (hb ? hb[0] : 0);
      });
    });
    return porDia;
  }

  /**
   * Conflitos de sala/professor: duas turmas no mesmo dia da semana com horário sobreposto.
   * Importante: só compara turmas do MESMO semestre — 2026.1 e 2026.2 não acontecem ao mesmo
   * tempo, então uma turma de cada não é um choque real de agenda.
   */
  function conferirConflitos(turmas) {
    const avisos = [];
    const porDiaSemestre = {};
    turmas.forEach(function (t) {
      diasDaTurma(t.dia).forEach(function (d) {
        const chave = (t.semestre || '') + '|' + d;
        (porDiaSemestre[chave] = porDiaSemestre[chave] || []).push(t);
      });
    });
    Object.keys(porDiaSemestre).forEach(function (chave) {
      const d = chave.split('|')[1];
      const lista = porDiaSemestre[chave];
      for (let i = 0; i < lista.length; i++) {
        for (let j = i + 1; j < lista.length; j++) {
          const a = lista[i], b = lista[j];
          const ha = horarioMin(a.horario), hb = horarioMin(b.horario);
          if (!horariosSeSobrepoem(ha, hb)) continue;
          if (a.professor && b.professor && norm(a.professor) === norm(b.professor)) {
            avisos.push({
              tipo: 'professor', dia: d, chave: ['prof', a.semestre, d, a.id, b.id].join('|'),
              msg: 'Choque de professor (' + a.semestre + '): ' + a.professor + ' tem "' + a.turma + '" (' + a.horario + ') e "' + b.turma + '" (' + b.horario + ') em ' + DIAS_FULL[d] + '.',
              turmas: [a.id, b.id],
            });
          }
          if (a.sala && b.sala && norm(a.sala) === norm(b.sala) && !/online/i.test(a.sala)) {
            avisos.push({
              tipo: 'sala', dia: d, chave: ['sala', a.semestre, d, a.id, b.id].join('|'),
              msg: 'Choque de sala (' + a.sala + ', ' + a.semestre + '): "' + a.turma + '" (' + a.professor + ', ' + a.horario + ') e "' + b.turma + '" (' + b.professor + ', ' + b.horario + ') em ' + DIAS_FULL[d] + '.',
              turmas: [a.id, b.id],
            });
          }
        }
      }
    });
    turmas.forEach(function (t) {
      if (!t.sala && !/online/i.test(t.turma || '') && t.situacao && /andamento/i.test(t.situacao)) {
        avisos.push({
          tipo: 'sem-sala', dia: '', chave: ['sem-sala', t.id].join('|'),
          msg: 'Sem sala definida: "' + t.turma + '" (' + t.professor + ', ' + t.dia + ' ' + t.horario + ', ' + t.semestre + ').',
          turmas: [t.id],
        });
      }
    });
    return avisos;
  }

  /** Junta nomes de forma natural: "A", "A e B", "A, B e C". */
  function juntarNatural(lista) {
    const l = (lista || []).filter(Boolean);
    if (l.length <= 1) return l.join('');
    if (l.length === 2) return l.join(' e ');
    return l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1];
  }

  // ---------------- Matrícula e contrato semestral ----------------

  /**
   * O contrato é sempre semestral: começa em qualquer dia e termina em 30/06 (se começou entre
   * janeiro e junho) ou 31/12 (se começou entre julho e dezembro) do mesmo ano.
   */
  function fimContrato(dataInicioISO) {
    const d = new Date(dataInicioISO + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    const ano = d.getFullYear(), mes = d.getMonth() + 1; // 1-12
    return mes <= 6 ? (ano + '-06-30') : (ano + '-12-31');
  }

  /** Dias entre hoje e uma data ISO (negativo se já passou). */
  function diasAte(dataISO, hojeISO) {
    const hoje = new Date((hojeISO || new Date().toISOString().slice(0, 10)) + 'T00:00:00');
    const alvo = new Date(dataISO + 'T00:00:00');
    if (isNaN(alvo.getTime())) return null;
    return Math.round((alvo.getTime() - hoje.getTime()) / 86400000);
  }

  /** '2026.1' (jan-jun) ou '2026.2' (jul-dez), a partir de uma data ISO. */
  function semestreDeData(dataISO) {
    const d = new Date(dataISO + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    const ano = d.getFullYear(), mes = d.getMonth() + 1;
    return ano + (mes <= 6 ? '.1' : '.2');
  }

  function pad2Data(n) { return (n < 10 ? '0' : '') + n; }
  function isoDeData(d) { return d.getFullYear() + '-' + pad2Data(d.getMonth() + 1) + '-' + pad2Data(d.getDate()); }

  /** Soma (ou subtrai, com n negativo) dias a uma data ISO, devolvendo outra data ISO. */
  function somaDias(dataISO, n) {
    const d = new Date(dataISO + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return isoDeData(d);
  }

  /**
   * Dias de atraso a partir de um "dia de vencimento" mensal (1-31) e a data de hoje. Acha o
   * vencimento mais recente que já passou (deste mês, ou do mês anterior se o dia deste mês
   * ainda não chegou) e devolve a diferença em dias. Devolve null se o dia de vencimento não
   * for um número válido. Usado só como sugestão (não decide nada sozinho).
   */
  function diasEmAtraso(diaVencimento, hojeISO) {
    const dia = parseInt(diaVencimento, 10);
    if (!dia || dia < 1 || dia > 31) return null;
    const hoje = new Date((hojeISO || new Date().toISOString().slice(0, 10)) + 'T00:00:00');
    function ultimoDiaDoMes(ano, mesZeroBased) { return new Date(ano, mesZeroBased + 1, 0).getDate(); }
    function candidato(ano, mesZeroBased) {
      return new Date(ano, mesZeroBased, Math.min(dia, ultimoDiaDoMes(ano, mesZeroBased)));
    }
    let c = candidato(hoje.getFullYear(), hoje.getMonth());
    if (c.getTime() > hoje.getTime()) {
      let mes = hoje.getMonth() - 1, ano = hoje.getFullYear();
      if (mes < 0) { mes = 11; ano--; }
      c = candidato(ano, mes);
    }
    return Math.round((hoje.getTime() - c.getTime()) / 86400000);
  }

  /** Segunda-feira da semana de uma data ISO (ou de hoje, se omitida). */
  function segundaDaSemana(dataISO) {
    const d = new Date((dataISO || new Date().toISOString().slice(0, 10)) + 'T00:00:00');
    const diaSemana = (d.getDay() + 6) % 7; // 0=SEG .. 6=DOM
    d.setDate(d.getDate() - diaSemana);
    return isoDeData(d);
  }

  /** "dd/mm" a partir de uma data ISO. */
  function fmtCurta(dataISO) {
    const d = new Date(dataISO + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return pad2Data(d.getDate()) + '/' + pad2Data(d.getMonth() + 1);
  }

  // ---------------- Mensagens de WhatsApp (botão "preparar e revisar") ----------------

  function telefoneParaWhatsApp(tel) {
    const digitos = String(tel || '').replace(/\D/g, '');
    if (!digitos) return '';
    return digitos.length <= 11 ? '55' + digitos : digitos;
  }

  function linkWhatsApp(telefone, mensagem) {
    const num = telefoneParaWhatsApp(telefone);
    const texto = encodeURIComponent(mensagem || '');
    return num ? ('https://wa.me/' + num + '?text=' + texto) : ('https://wa.me/?text=' + texto);
  }

  function mensagemRematricula(aluno, turma) {
    const primeiroNome = String(aluno.nome || '').split(' ')[0];
    return 'Olá, ' + primeiroNome + '! Aqui é da Washington Ilha. 😊\n\n' +
      'Está chegando a hora da rematrícula da turma "' + (turma ? turma.turma : '') + '" para o próximo semestre. ' +
      'Quer que a gente já garanta sua vaga no mesmo horário (' + (turma ? (turma.dia + ' ' + turma.horario) : '') + ')?\n\n' +
      'Qualquer dúvida sobre valores ou datas, me conta por aqui mesmo!';
  }

  function mensagemMaterialDidatico(aluno, turma, livro) {
    const primeiroNome = String(aluno.nome || '').split(' ')[0];
    const livroTxt = livro ? ('o livro "' + livro + '"') : 'o material didático';
    return 'Olá, ' + primeiroNome + '! Aqui é da Washington Ilha. 📚\n\n' +
      'Passando para avisar que, para a turma "' + (turma ? turma.turma : '') + '", você precisa comprar ' + livroTxt + '. ' +
      'Me avisa se precisar de alguma orientação para conseguir o material!';
  }

  /** etapa 1 = lembrete amigável (padrão), 2 = segundo aviso, 3+ = aviso final. */
  function mensagemCobranca(aluno, etapa) {
    const primeiroNome = String(aluno.nome || '').split(' ')[0];
    const et = etapa || 1;
    if (et >= 3) {
      return 'Olá, ' + primeiroNome + '! Aqui é da Washington Ilha.\n\n' +
        'Essa é nossa última tentativa de contato sobre a mensalidade em aberto. Pedimos a regularização nos próximos dias para evitar a suspensão das aulas. ' +
        'Se já pagou, me manda o comprovante por aqui que eu confirmo. Qualquer dificuldade, nos avisa que a gente conversa.';
    }
    if (et === 2) {
      return 'Olá, ' + primeiroNome + '! Aqui é da Washington Ilha.\n\n' +
        'Reforçando: ainda consta uma mensalidade pendente. Pode verificar e regularizar quando possível? ' +
        'Se já tiver pago, me manda o comprovante por aqui que eu confirmo. Obrigada!';
    }
    return 'Olá, ' + primeiroNome + '! Aqui é da Washington Ilha.\n\n' +
      'Estamos com uma pendência referente à mensalidade. Pode verificar e regularizar quando possível? ' +
      'Se já tiver pago, pode me mandar o comprovante por aqui que eu confirmo. Obrigada!';
  }

  /** Dias até o próximo aniversário (dia/mês de dataNascimentoISO), a partir de hojeISO — sempre
      >= 0, contando o próximo que ainda vai acontecer (já vira pro ano seguinte se o dia/mês já
      passou este ano). Devolve null se a data de nascimento não for válida. */
  function diasAteAniversario(dataNascimentoISO, hojeISO) {
    const nasc = new Date((dataNascimentoISO || '') + 'T00:00:00');
    if (isNaN(nasc.getTime())) return null;
    const hoje = new Date((hojeISO || new Date().toISOString().slice(0, 10)) + 'T00:00:00');
    let prox = new Date(hoje.getFullYear(), nasc.getMonth(), nasc.getDate());
    if (prox.getTime() < hoje.getTime()) prox = new Date(hoje.getFullYear() + 1, nasc.getMonth(), nasc.getDate());
    return Math.round((prox.getTime() - hoje.getTime()) / 86400000);
  }

  function mensagemAniversario(aluno) {
    const primeiroNome = String(aluno.nome || '').split(' ')[0];
    return 'Parabéns, ' + primeiroNome + '! 🎉🎂\n\n' +
      'A equipe da Washington Ilha deseja um feliz aniversário pra você! Que seu novo ciclo venha cheio de conquistas. 😊';
  }

  // ---------------- Calendário (.ics) — só "adicionar à agenda", sem sincronização de via dupla ----------------

  /** Próxima data (a partir de hoje) em que a turma tem aula, para um dos dias da semana dela. */
  function proximaData(diaSemana, aPartirDe) {
    const idxAlvo = DIAS_ORDEM.indexOf(diaSemana);
    if (idxAlvo < 0) return null;
    const base = aPartirDe ? new Date(aPartirDe) : new Date();
    base.setHours(0, 0, 0, 0);
    // getDay(): 0=domingo..6=sábado; nosso DIAS_ORDEM é SEG..DOM
    const hojeIdx = (base.getDay() + 6) % 7; // 0=SEG .. 6=DOM
    let diff = idxAlvo - hojeIdx;
    if (diff < 0) diff += 7;
    const d = new Date(base);
    d.setDate(d.getDate() + diff);
    return d;
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function icsDataHora(data, minutosDoDia) {
    const d = new Date(data);
    const h = Math.floor(minutosDoDia / 60), m = minutosDoDia % 60;
    return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + 'T' + pad2(h) + pad2(m) + '00';
  }

  /** Gera um .ics com um evento recorrente (RRULE semanal) por dia da semana da turma. */
  function icsTurma(turma) {
    const dias = diasDaTurma(turma.dia);
    const hm = horarioMin(turma.horario);
    const RRULE_DIA = { SEG: 'MO', TER: 'TU', QUA: 'WE', QUI: 'TH', SEX: 'FR', 'SÁB': 'SA', DOM: 'SU' };
    const linhas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Washington Ilha//Painel//PT-BR', 'CALSCALE:GREGORIAN'];
    dias.forEach(function (d, i) {
      const prox = proximaData(d);
      if (!prox || !hm) return;
      const uid = turma.id + '-' + d + '@academiawashington';
      linhas.push('BEGIN:VEVENT');
      linhas.push('UID:' + uid);
      linhas.push('DTSTAMP:' + icsDataHora(new Date(), 0));
      linhas.push('DTSTART:' + icsDataHora(prox, hm[0]));
      linhas.push('DTEND:' + icsDataHora(prox, hm[1]));
      if (RRULE_DIA[d]) linhas.push('RRULE:FREQ=WEEKLY;BYDAY=' + RRULE_DIA[d]);
      linhas.push('SUMMARY:' + (turma.turma || 'Aula') + ' — ' + (turma.professor || ''));
      linhas.push('DESCRIPTION:Turma ' + (turma.turma || '') + (turma.sala ? (' · Sala ' + turma.sala) : '') + ' · Professor(a) ' + (turma.professor || ''));
      if (turma.sala) linhas.push('LOCATION:' + turma.sala);
      linhas.push('END:VEVENT');
    });
    linhas.push('END:VCALENDAR');
    return linhas.join('\r\n');
  }

  function baixarIcsTurma(turma) {
    const conteudo = icsTurma(turma);
    const blob = new Blob([conteudo], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'aula-' + norm(turma.turma).replace(/\s+/g, '-') + '-' + norm(turma.dia).replace(/\s+/g, '-') + '.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  /** "segunda-feira, 05/10/2026" a partir de uma data ISO. */
  function fmtLonga(dataISO) {
    const d = new Date(dataISO + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    const NOMES = { SEG: 'segunda-feira', TER: 'terça-feira', QUA: 'quarta-feira', QUI: 'quinta-feira', SEX: 'sexta-feira', 'SÁB': 'sábado', DOM: 'domingo' };
    const idx = (d.getDay() + 6) % 7;
    return NOMES[DIAS_ORDEM[idx]] + ', ' + pad2Data(d.getDate()) + '/' + pad2Data(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  /** Converte "14h30", "14:30", "14h" em minutos desde meia-noite (ou null se não der pra entender). */
  function horaParaMin(horaTxt) {
    const m = String(horaTxt || '').match(/(\d{1,2})[h:]?(\d{2})?/);
    if (!m) return null;
    const h = Number(m[1]), min = m[2] ? Number(m[2]) : 0;
    if (isNaN(h) || h > 23) return null;
    return h * 60 + min;
  }

  /** Gera um .ics com um único evento (não recorrente) para um compromisso numa data/hora específica. */
  function icsCompromisso(c) {
    const min = horaParaMin(c.horario);
    const dataHora = new Date((c.data || '') + 'T00:00:00');
    if (isNaN(dataHora.getTime())) return '';
    const inicioMin = min == null ? 9 * 60 : min;
    const uid = 'compromisso-' + (c.id || Date.now()) + '@academiawashington';
    const linhas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Washington Ilha//Painel//PT-BR', 'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT', 'UID:' + uid, 'DTSTAMP:' + icsDataHora(new Date(), 0),
      'DTSTART:' + icsDataHora(dataHora, inicioMin), 'DTEND:' + icsDataHora(dataHora, inicioMin + 30),
      'SUMMARY:' + (c.titulo || 'Compromisso') + (c.comQuem ? (' — ' + c.comQuem) : ''),
      'DESCRIPTION:' + (c.obs || '').replace(/\r?\n/g, ' '),
    ];
    if (c.local) linhas.push('LOCATION:' + c.local);
    linhas.push('END:VEVENT', 'END:VCALENDAR');
    return linhas.join('\r\n');
  }

  function baixarIcsCompromisso(c) {
    const conteudo = icsCompromisso(c);
    if (!conteudo) return;
    const blob = new Blob([conteudo], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'compromisso-' + norm(c.titulo || 'evento').replace(/\s+/g, '-') + '-' + (c.data || '') + '.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function mensagemConfirmacaoCompromisso(c, nomeResponsavel) {
    const primeiroNome = String(nomeResponsavel || '').split(' ')[0];
    const saud = primeiroNome ? ('Olá, ' + primeiroNome + '! ') : 'Olá! ';
    return saud + 'Aqui é da Washington Ilha. 📅\n\n' +
      'Confirmando nosso compromisso: "' + (c.titulo || '') + '", ' + fmtLonga(c.data) + (c.horario ? (' às ' + c.horario) : '') + (c.local ? (', em ' + c.local) : '') + '.\n\n' +
      'Qualquer imprevisto, me avisa por aqui que a gente reagenda!';
  }

  // ---------------- Frequência (chamada por turma/aula) ----------------

  /** Código do dia da semana (SEG..DOM) de uma data ISO. */
  function diaDaSemana(dataISO) {
    const d = new Date(dataISO + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return DIAS_ORDEM[(d.getDay() + 6) % 7];
  }

  /** Resume as chamadas (lista de {presencas:{alunoId:bool}}) para um aluno: total, presenças, faltas, % presença. */
  function resumoFrequencia(chamadas, alunoId) {
    let total = 0, presencas = 0;
    (chamadas || []).forEach(function (c) {
      if (c.presencas && Object.prototype.hasOwnProperty.call(c.presencas, alunoId)) {
        total++;
        if (c.presencas[alunoId]) presencas++;
      }
    });
    const pct = total ? Math.round((presencas / total) * 100) : null;
    return { total: total, presencas: presencas, faltas: total - presencas, pct: pct };
  }

  // ---------------- Importação de relatório do Asaas (pagamentos) ----------------

  /**
   * Faz o parse de um CSV exportado do Asaas (relatório de cobranças). Aceita nomes de coluna
   * em variações comuns (cliente/nome, status, vencimento/data, valor). Devolve uma lista de
   * {nome, status, vencimento, valor} — o pareamento com o aluno é feito por nome (normalizado)
   * na camada do app.js, porque o Asaas não compartilha nenhum ID com esta planilha de turmas.
   */
  function parseAsaasCSV(texto) {
    const linhas = String(texto || '').split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (!linhas.length) return [];
    const sep = linhas[0].indexOf(';') > -1 && linhas[0].indexOf(';') < linhas[0].indexOf(',') ? ';' : ',';
    const cab = linhas[0].split(sep).map(function (h) { return norm(h); });
    function col(nomes) {
      for (let i = 0; i < cab.length; i++) if (nomes.indexOf(cab[i]) > -1) return i;
      return -1;
    }
    const iNome = col(['cliente', 'nome', 'nome do cliente', 'pagador']);
    const iStatus = col(['status', 'situacao']);
    const iVenc = col(['vencimento', 'data de vencimento', 'data vencimento']);
    const iValor = col(['valor', 'valor (r$)', 'valor cobranca']);
    // No Asaas o boleto quase sempre sai no nome de quem paga (responsável/pai), não no nome do
    // aluno — mas o nome do aluno costuma aparecer na descrição/histórico da cobrança. Pegamos
    // essa coluna também (quando existir) para o app.js tentar casar por ela como 2ª tentativa.
    const iDescricao = col(['descricao', 'descrição', 'historico', 'histórico', 'observacoes', 'observações', 'referencia', 'referência']);
    if (iNome < 0) return [];
    const out = [];
    for (let i = 1; i < linhas.length; i++) {
      const cols = linhas[i].split(sep);
      const nome = (cols[iNome] || '').trim();
      if (!nome) continue;
      out.push({
        nome: nome,
        status: iStatus > -1 ? (cols[iStatus] || '').trim() : '',
        vencimento: iVenc > -1 ? (cols[iVenc] || '').trim() : '',
        valor: iValor > -1 ? (cols[iValor] || '').trim() : '',

<script>
/* Sincronização opcional entre navegadores (Polo 1740)
   -----------------------------------------------------
   Sem configuração (padrão), o painel funciona exatamente como antes: cada navegador guarda seu
   próprio rascunho em localStorage, e "publicar" é baixar o data.js e trocar o arquivo no GitHub.

   Com um projeto Firebase gratuito configurado em sync-config.js, este arquivo passa a manter os
   dados num banco compartilhado: a alteração que uma pessoa da equipe faz aparece para as outras
   em poucos segundos, em qualquer navegador, sem precisar baixar/subir arquivo nenhum. Como o
   banco passa a ser compartilhado, cada pessoa precisa de um login (e-mail + senha) próprio,
   criado pela coordenação no Firebase — veja o passo a passo no README ("Sincronizar entre
   navegadores" e "Login de cada pessoa da equipe").

      .then(function () { return (typeof firebase === 'undefined' || !firebase.auth) ? loadScript('https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/firebase-auth-compat.js') : null; })
      .then(function () { if (!firebase.apps.length) firebase.initializeApp(CONFIG); });

   * Liga a sincronização. `onRemoto(dados)` é chamado sempre que outro navegador salvar uma
   * mudança (dados = objeto com as mesmas chaves usadas em `push`). `onStatus(status)` é chamado
   * com 'sem-config' | 'conectando' | 'sincronizado' | 'erro'. `estadoAtual()` deve devolver o
   * estado local (usado só uma vez, para semear o banco se ele ainda estiver vazio).

   * Firestore bloqueiam quem não tiver feito login.

    if (!CONFIG) { onStatus && onStatus('sem-config'); return; }
    onStatus && onStatus('conectando');

      const db = firebase.firestore();
      docRef = db.collection('washington').doc('estado');
      let primeira = true;
      docRef.onSnapshot(function (snap) {
        onStatus && onStatus('sincronizado');
        if (snap.exists) {
          onRemoto(snap.data() || {});
        } else if (primeira && estadoAtual) {
          // Banco novo/vazio: semeia com o que já existe neste navegador.
          docRef.set(Object.assign({}, estadoAtual(), { atualizadoEm: new Date().toISOString() })).catch(function () { /* tenta de novo na próxima alteração */ });
        }

      }, function () {
        onStatus && onStatus('erro');
      });
    }).catch(function () {

  function push(parcial) {

  /**
   * Observa o estado de login. `cb(user)` é chamado agora e de novo sempre que a pessoa entrar
   * ou saír — `user` é o objeto do Firebase (tem `.email`) quando logada, ou `null` quando não.
   * Sem configuração, chama `cb(null)` uma vez (o painel trata isso como "não precisa de login").

  function mensagemErroLogin(err) {

      'auth/invalid-email': 'E-mail inválido.',
      'auth/missing-password': 'Digite a senha.',
      'auth/user-not-found': 'Não existe usuário com esse e-mail. Peça pra coordenação cadastrar o seu acesso.',
      'auth/wrong-password': 'Senha incorreta.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/too-many-requests': 'Muitas tentativas erradas. Aguarde um pouco e tente de novo.',
      'auth/user-disabled': 'Este acesso foi desativado. Fale com a coordenação.',
      'auth/network-request-failed': 'Sem conexão com a internet agora.',
      'auth/operation-not-allowed': 'O login por e-mail/senha ainda não foi ativado no Firebase (veja o README).',
    };
    return MAPA[codigo] || 'Não foi possível entrar. Confira o e-mail e a senha.';
  }

    configured: configured, init: init, push: push,
    watchAuth: watchAuth, signIn: signIn, signOut: signOut, mensagemErroLogin: mensagemErroLogin,
  };
});

  function relTempo(iso) {
    if (!iso) return '';
    const d = new Date(iso), min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 1) return 'agora';
    if (min < 60) return 'há ' + min + ' min';
    const h = Math.round(min / 60);
    if (h < 24) return 'há ' + h + 'h';
    const dias = Math.round(h / 24);
    if (dias === 1) return 'ontem';
    return 'há ' + dias + ' dias';
  }

  /* ---------- Google Calendar "adicionar" (link direto, sem OAuth, sem sincronização de via dupla) ---------- */
  function linkGoogleCalendar(turma) {
    const hm = L.horarioMin(turma.horario);
    const dias = L.diasDaTurma(turma.dia);
    if (!hm || !dias.length) return '';
    const prox = L.proximaData(dias[0]);
    if (!prox) return '';
    function fmt(d, min) {
      const dt = new Date(d); dt.setHours(Math.floor(min / 60), min % 60, 0, 0);
      return dt.getUTCFullYear() + String(dt.getUTCMonth() + 1).padStart(2, '0') + String(dt.getUTCDate()).padStart(2, '0') + 'T' +
        String(dt.getUTCHours()).padStart(2, '0') + String(dt.getUTCMinutes()).padStart(2, '0') + '00Z';
    }
    const RRULE_DIA = { SEG: 'MO', TER: 'TU', QUA: 'WE', QUI: 'TH', SEX: 'FR', 'SÁB': 'SA', DOM: 'SU' };
    const byday = dias.map(function (d) { return RRULE_DIA[d]; }).filter(Boolean).join(',');
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: turma.turma + ' — ' + turma.professor,
      dates: fmt(prox, hm[0]) + '/' + fmt(prox, hm[1]),
      details: 'Turma ' + turma.turma + (turma.sala ? (' · Sala ' + turma.sala) : '') + ' · Professor(a) ' + turma.professor,
      location: turma.sala || '',
      recur: 'RRULE:FREQ=WEEKLY;BYDAY=' + byday,
    });
    return 'https://calendar.google.com/calendar/render?' + params.toString();
  }

  /* ---------- Navegação ---------- */
  // Como render() reconstrói o HTML inteiro da tela a cada tecla digitada (campos de busca/filtro chamam
  // render() no evento 'input'/'change' para atualizar a lista na hora), o campo que estava com foco perderia
  // o foco e o cursor a cada letra digitada — dando a sensação de "trava" ao digitar ou ao escolher algo numa
  // lista. Por isso guardamos qual campo estava focado (e a posição do cursor) antes de redesenhar, e
  // devolvemos o foco pro campo equivalente depois.
  function capturarFoco(container) {
    const el = document.activeElement;
    if (!el || !container.contains(el) || !el.dataset) return null;
    return {
      act: el.dataset.act || '', id: el.dataset.id || '', campo: el.dataset.campo || '',
      selStart: (typeof el.selectionStart === 'number') ? el.selectionStart : null,
      selEnd: (typeof el.selectionEnd === 'number') ? el.selectionEnd : null,
    };
  }
  function restaurarFoco(container, foco) {
    if (!foco || !foco.act) return false;
    let sel = '[data-act="' + foco.act + '"]';
    if (foco.id) sel += '[data-id="' + foco.id + '"]';
    if (foco.campo) sel += '[data-campo="' + foco.campo + '"]';
    let novo;
    try { novo = container.querySelector(sel); } catch (e) { novo = null; }
    if (!novo) return false;
    // Não refoca <select>: em alguns navegadores (principalmente no celular/tablet), chamar
    // .focus() de novo bem na hora em que a lista acabou de fechar faz ela reabrir sozinha,
    // dando a sensação de o botão/lista "travar". Como a escolha já foi feita, não tem cursor
    // ou posição de digitação para preservar aqui.
    if (novo.tagName === 'SELECT') return false;
    novo.focus();
    if (foco.selStart != null && novo.setSelectionRange) { try { novo.setSelectionRange(foco.selStart, foco.selEnd); } catch (e) { /* ignora */ } }
    return true;
  }

  /* ---------- Semana (calendário com datas reais) ---------- */
  /* Paleta cíclica para colorir cada professor(a) na grade da semana — ajuda a enxergar de longe
     quem está em qual horário, sem precisar ler o nome em cada card. */
  const PROF_CORES = ['#1565c0', '#9c4221', '#1b7a46', '#8a3ba0', '#b7791f', '#0e7490', '#b42318', '#4a5568'];
  function corDoProfessor(nome) {
    const lista = D.profsOrdenados || (D.profsOrdenados = Array.from(new Set(S.turmas.map(function (t) { return t.professor || '—'; }))).sort());
    const i = lista.indexOf(nome || '—');
    return PROF_CORES[(i < 0 ? 0 : i) % PROF_CORES.length];
  }

    const oculto = V.semProfsOcultos[t.professor || '—'];
    return '<div class="grade-item' + (oculto ? ' dim' : '') + '" style="--pc:' + corDoProfessor(t.professor) + '" data-act="ver-turma" data-id="' + t.id + '">' +
      '<div class="gi-hora">' + esc(t.horario) + '</div><div class="gi-turma">' + esc(t.turma) + '</div>' +
      '<div class="gi-prof">' + esc(t.professor || '') + (t.sala ? (' · ' + esc(t.sala)) : '') + '</div></div>';

  /* Separa, dentro do dia de HOJE, as turmas cujo horário já terminou (segundo o relógio agora)
     das que ainda vão rolar — só faz sentido pro dia de hoje; nos outros dias (passados ou
     futuros) a lista inteira continua igual, sem essa separação. Turma com horário que não dá
     pra entender (texto fora do padrão) fica do lado "futuras", pra nunca sumir por engano. */
  function separarJaAconteceu(lista, ehHoje) {
    if (!ehHoje) return { futuras: lista, passadas: [] };
    const futuras = [], passadas = [];
    lista.forEach(function (t) {
      const hm = L.horarioMin(t.horario);
      if (hm && hm[1] <= AGORA_MIN) passadas.push(t); else futuras.push(t);
    });
    return { futuras: futuras, passadas: passadas };
  }
  function blocoJaAconteceu(passadas) {
    if (!passadas.length) return '';
    return '<details class="ja-aconteceu"><summary>Já aconteceu hoje (' + passadas.length + ')</summary>' +
      passadas.map(itemTurmaHTML).join('') + '</details>';
  }

  /* Números que viram alerta tanto na Visão geral quanto no indicador ambiente (título da aba do
     navegador) — centralizados aqui pra não calcular a mesma coisa em dois lugares diferentes. */
  function contarAlertasGerais() {
    const inad = S.alunos.filter(function (a) { return !a.bolsista && !a.cancelado && (a.pagamento.status === 'atrasado' || a.pagamento.status === 'pendente'); });
    const totalAberto = inad.reduce(function (s, a) { const v = Number(normalizarValorMoeda(a.pagamento.valorEmAberto)); return s + (isNaN(v) ? 0 : v); }, 0);
    const aniversariantesSemana = alunosAniversariantesProximos().filter(function (x) { return x.dias <= 7; });
    const rematriculas = alunosRematriculaProxima();
    const pendAtrasadas = S.pendencias.filter(function (p) { return !p.resolvida && p.prazo && p.prazo < HOJE; });
    const despAtrasadas = despesasAtrasadas();
    const total = inad.length + aniversariantesSemana.length + rematriculas.length + pendAtrasadas.length + despAtrasadas.length;
    return { inad: inad, totalAberto: totalAberto, aniversariantesSemana: aniversariantesSemana, rematriculas: rematriculas, pendAtrasadas: pendAtrasadas, despAtrasadas: despAtrasadas, total: total };
  }
  /* Indicador ambiente: mostra "(N)" no título da aba do navegador quando há alertas pendentes,
     pra dar pra notar sem precisar abrir/entrar no painel — só olhando a aba já dá pra ver. */
  function atualizarTituloAba() {
    const n = contarAlertasGerais().total;
    document.title = (n > 0 ? ('(' + n + ') ') : '') + 'Painel acadêmico · Washington Ilha';
  }
  function viewVisaoGeral() {
    const mesAtual = mesDeData(HOJE);
    const alertas = contarAlertasGerais();
    const inad = alertas.inad, totalAberto = alertas.totalAberto, aniversariantesSemana = alertas.aniversariantesSemana,
      rematriculas = alertas.rematriculas, pendAtrasadas = alertas.pendAtrasadas, despAtrasadas = alertas.despAtrasadas;
    const entradasMes = totalLista(S.entradas, mesAtual);
    const despesasMes = totalLista(S.despesas, mesAtual);
    return '<div class="topo"><h1>Visão geral</h1></div>' +
      '<div class="stats-topo">' +
      statTileLink(inad.length, 'inadimplente(s)' + (totalAberto ? (' · ' + fmtReais(totalAberto)) : ''), 'inadimplencia') +
      statTileLink(aniversariantesSemana.length, 'aniversariante(s) na semana', 'alunos') +
      statTileLink(rematriculas.length, 'rematrícula(s) vencendo', 'alunos') +
      statTileLink(pendAtrasadas.length, 'pendência(s) atrasada(s)', 'pendencias') +
      statTileLink(despAtrasadas.length, 'despesa(s) atrasada(s)', 'despesas') +
      '</div>' +
      '<p class="muted">Saldo de ' + esc(nomeMes(mesAtual)) + ': entradas ' + fmtReais(entradasMes) + ' · despesas ' + fmtReais(despesasMes) + ' · ' + saldoTag(entradasMes - despesasMes) + '</p>' +
      (aniversariantesSemana.length ? ('<h2 class="subtitulo">Aniversariantes na semana (' + aniversariantesSemana.length + ')</h2>' + aniversariantesSemana.map(cardAlunoAniversario).join('')) : '') +
      (rematriculas.length ? ('<h2 class="subtitulo">Rematrículas vencendo (' + rematriculas.length + ')</h2>' + rematriculas.slice(0, 5).map(cardAlunoRematriculaProxima).join('') +
        (rematriculas.length > 5 ? ('<p class="muted">+ ' + (rematriculas.length - 5) + ' outra(s) — veja todas em Alunos.</p>') : '')) : '') +
      (pendAtrasadas.length ? ('<h2 class="subtitulo">Pendências atrasadas (' + pendAtrasadas.length + ')</h2>' + pendAtrasadas.map(linhaPendencia).join('')) : '') +
      (despAtrasadas.length ? ('<h2 class="subtitulo">Despesas atrasadas (' + despAtrasadas.length + ')</h2><table class="tabela"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Pago por</th><th>Status</th><th></th></tr></thead><tbody>' + despAtrasadas.map(function (d) { return linhaDespesa(d, 'washington'); }).join('') + '</tbody></table>') : '') +
      (!inad.length && !aniversariantesSemana.length && !rematriculas.length && !pendAtrasadas.length && !despAtrasadas.length ? '<p class="muted">Nada pegando fogo agora. 🎉</p>' : '');
  }
  function viewSemana() {
    if (V.semanaModo === 'dia') return viewDia();
    if (V.semanaModo === 'mes') return viewMes();
    const segunda = L.somaDias(L.segundaDaSemana(HOJE), V.semanaOffset * 7);
    const semestreSemana = L.semestreDeData(segunda);
    const turmasDoSemestreTodas = S.turmas.filter(function (t) { return t.semestre === semestreSemana && t.situacao !== 'A confirmar'; });
    // Turma sem nenhum aluno ainda matriculado não ajuda a enxergar a rotina da semana (e ainda
    // mais com muitas turmas no dia, ela só disputa espaço visual) — deixamos essas só na lista
    // "Turmas em formação" logo abaixo da grade, junto com as que estão "A confirmar".
    const turmasDoSemestre = turmasDoSemestreTodas.filter(function (t) { return (t.alunosNomes || []).length > 0; });
    const semAluno = turmasDoSemestreTodas.filter(function (t) { return (t.alunosNomes || []).length === 0; });
    const confirmar = S.turmas.filter(function (t) { return t.semestre === semestreSemana && t.situacao === 'A confirmar'; }).concat(semAluno);
    D.profsOrdenados = Array.from(new Set(turmasDoSemestre.map(function (t) { return t.professor || '—'; }))).sort();
    const grade = L.gradeSemanal(turmasDoSemestre);
    const diasSemana = L.DIAS_ORDEM.map(function (d, i) { return { id: d, data: L.somaDias(segunda, i) }; });
    const colunas = diasSemana.map(function (dia) {
      const listaTodas = grade[dia.id] || [];
      const compromissosDoDia = S.compromissos.filter(function (c) { return c.data === dia.data && c.status === 'agendado'; })
        .sort(function (a, b) { return (a.horario || '').localeCompare(b.horario || ''); });
      const ehHoje = dia.data === HOJE;
      const sep = separarJaAconteceu(listaTodas, ehHoje);
      const vazio = !sep.futuras.length && !compromissosDoDia.length && !sep.passadas.length;
      return '<div class="grade-col' + (ehHoje ? ' hoje' : '') + '"><div class="grade-col-h">' + L.DIAS_FULL[dia.id] + '<span class="grade-col-data">' + esc(L.fmtCurta(dia.data)) + '</span></div>' +
        compromissosDoDia.map(itemCompromissoHTML).join('') +
        sep.futuras.map(itemTurmaHTML).join('') +
        blocoJaAconteceu(sep.passadas) +
        (vazio ? '<div class="grade-vazio">—</div>' : '') + '</div>';
    }).join('');
    const faixa = L.fmtCurta(segunda) + ' – ' + L.fmtCurta(L.somaDias(segunda, 6)) + ' · semestre ' + semestreSemana;
    return '<div class="topo"><h1>Semana</h1><div class="topo-acoes">' +
      botoesModoSemana() +
      '<button class="btn sm" type="button" data-act="semana-nav" data-d="-1">← Semana anterior</button>' +
      '<button class="btn sm" type="button" data-act="semana-nav" data-d="0">Hoje</button>' +
      '<button class="btn sm" type="button" data-act="semana-nav" data-d="1">Próxima semana →</button>' +
      '</div></div>' +
      '<p class="muted">' + esc(faixa) + '</p>' +
      legendaProfs() +
      '<div class="grade">' + colunas + '</div>' +
      (confirmar.length ? ('<h2 class="subtitulo">Turmas em formação (' + confirmar.length + ')</h2><p class="muted">A confirmar ou ainda sem nenhum aluno matriculado — por isso não aparecem na grade acima.</p><div class="lista-cards">' + confirmar.map(function (t) { return cardTurma(t); }).join('') + '</div>') : '');
  }

  /* ---------- Semana, modo "Só um dia": agenda vertical de um único dia, mais fácil de ler que
     7 colunas espremidas quando o que importa é só "o que tenho hoje" ---------- */
  function viewDia() {
    const dataAtual = L.somaDias(HOJE, V.diaOffsetDias);
    const diaId = L.diaDaSemana(dataAtual);
    const semestreDia = L.semestreDeData(dataAtual);
    const turmasDoSemestreTodas = S.turmas.filter(function (t) { return t.semestre === semestreDia && t.situacao !== 'A confirmar' && (t.alunosNomes || []).length > 0; });
    D.profsOrdenados = Array.from(new Set(turmasDoSemestreTodas.map(function (t) { return t.professor || '—'; }))).sort();
    const turmasDoDia = turmasDoSemestreTodas.filter(function (t) { return L.diasDaTurma(t.dia).indexOf(diaId) > -1; })
      .sort(function (a, b) { const ha = L.horarioMin(a.horario), hb = L.horarioMin(b.horario); return (ha ? ha[0] : 0) - (hb ? hb[0] : 0); });
    const compromissosDoDia = S.compromissos.filter(function (c) { return c.data === dataAtual && c.status === 'agendado'; })
      .sort(function (a, b) { return (a.horario || '').localeCompare(b.horario || ''); });
    const ehHoje = dataAtual === HOJE;
    const sep = separarJaAconteceu(turmasDoDia, ehHoje);
    // junta turmas (ainda por vir) e compromissos numa única lista, ordenada por horário
    const eventos = sep.futuras.map(function (t) { const hm = L.horarioMin(t.horario); return { ini: hm ? hm[0] : 9999, html: itemTurmaHTML(t) }; })
      .concat(compromissosDoDia.map(function (c) { const m = L.horaParaMin(c.horario); return { ini: m == null ? 9999 : m, html: itemCompromissoHTML(c) }; }))
      .sort(function (a, b) { return a.ini - b.ini; });
    const vazio = !eventos.length && !sep.passadas.length;
    return '<div class="topo"><h1>Semana</h1><div class="topo-acoes">' +
      botoesModoSemana() +
      '<button class="btn sm" type="button" data-act="dia-nav" data-d="-1">← Dia anterior</button>' +
      '<button class="btn sm" type="button" data-act="dia-nav" data-d="0">Hoje</button>' +
      '<button class="btn sm" type="button" data-act="dia-nav" data-d="1">Próximo dia →</button>' +
      '</div></div>' +
      '<p class="muted">' + esc(L.DIAS_FULL[diaId]) + ', ' + esc(L.fmtCurta(dataAtual)) + (ehHoje ? ' · hoje' : '') + ' · semestre ' + esc(semestreDia) + '</p>' +
      '<div class="agenda-dia">' +
      (eventos.length ? eventos.map(function (e) { return e.html; }).join('') : (vazio ? '<div class="grade-vazio">Nenhuma turma ou compromisso neste dia.</div>' : '')) +
      blocoJaAconteceu(sep.passadas) +
      '</div>';
  }

  /* ---------- Semana, modo "Mês": grade mensal (estilo calendário), uma bolinha/linha colorida
     por professor em cada dia — visão mais fácil de enxergar a rotina do mês inteiro de uma vez.
     Toque num dia pra ver as turmas e compromissos daquele dia (mesma vista do modo "Só um dia"). ---------- */
  const NOMES_MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  function viewMes() {
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function isoLocal(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    const hojeD = new Date(HOJE + 'T00:00:00');
    const totalMeses = hojeD.getMonth() + V.mesOffset;
    const ano = hojeD.getFullYear() + Math.floor(totalMeses / 12);
    const mes = ((totalMeses % 12) + 12) % 12;
    const primeiroDia = new Date(ano, mes, 1);
    const ultimoDia = new Date(ano, mes + 1, 0);
    const inicioGrade = new Date(primeiroDia);
    inicioGrade.setDate(inicioGrade.getDate() - ((primeiroDia.getDay() + 6) % 7));
    const fimGrade = new Date(ultimoDia);
    fimGrade.setDate(fimGrade.getDate() + (6 - ((ultimoDia.getDay() + 6) % 7)));
    const dias = [];
    for (let d = new Date(inicioGrade); d.getTime() <= fimGrade.getTime(); d.setDate(d.getDate() + 1)) dias.push(new Date(d));
    const tituloMes = NOMES_MESES[mes] + ' de ' + ano;
    const semestresDoMes = Array.from(new Set([L.semestreDeData(isoLocal(primeiroDia)), L.semestreDeData(isoLocal(ultimoDia))]));
    const turmasDoMes = S.turmas.filter(function (t) { return semestresDoMes.indexOf(t.semestre) > -1 && t.situacao !== 'A confirmar' && (t.alunosNomes || []).length > 0; });
    D.profsOrdenados = Array.from(new Set(turmasDoMes.map(function (t) { return t.professor || '—'; }))).sort();
    const MAX_VISIVEIS = 3;
    const celulas = dias.map(function (d) {
      const dataISO = isoLocal(d);
      const noMesAtual = d.getMonth() === mes;
      const ehHoje = dataISO === HOJE;
      const diaId = L.diaDaSemana(dataISO);
      const semestreDia = L.semestreDeData(dataISO);
      const turmasDoDia = turmasDoMes.filter(function (t) { return t.semestre === semestreDia && L.diasDaTurma(t.dia).indexOf(diaId) > -1; });
      const compromissosDoDia = S.compromissos.filter(function (c) { return c.data === dataISO && c.status === 'agendado'; });
      const eventos = turmasDoDia.map(function (t) {
        const hm = L.horarioMin(t.horario);
        const oculto = V.semProfsOcultos[t.professor || '—'];
        return { ini: hm ? hm[0] : 9999, html: '<div class="mes-item' + (oculto ? ' dim' : '') + '" style="--pc:' + corDoProfessor(t.professor) + '">' + esc((t.horario || '').split(' ')[0] || '') + ' ' + esc(t.turma) + '</div>' };
      }).concat(compromissosDoDia.map(function (c) {
        const m = L.horaParaMin(c.horario);
        return { ini: m == null ? 9999 : m, html: '<div class="mes-item mes-item-compromisso">📅 ' + esc(c.titulo) + '</div>' };
      })).sort(function (a, b) { return a.ini - b.ini; });
      const visiveis = eventos.slice(0, MAX_VISIVEIS);
      const sobrando = eventos.length - visiveis.length;
      return '<div class="mes-dia' + (noMesAtual ? '' : ' fora-do-mes') + (ehHoje ? ' hoje' : '') + '" data-act="mes-abrir-dia" data-data="' + dataISO + '">' +
        '<div class="mes-dia-num">' + d.getDate() + '</div>' +
        '<div class="mes-dia-itens">' + visiveis.map(function (e) { return e.html; }).join('') + (sobrando > 0 ? ('<div class="mes-mais">+' + sobrando + ' mais</div>') : '') + '</div>' +
        '</div>';
    }).join('');
    return '<div class="topo"><h1>Semana</h1><div class="topo-acoes">' +
      botoesModoSemana() +
      '<button class="btn sm" type="button" data-act="mes-nav" data-d="-1">← Mês anterior</button>' +
      '<button class="btn sm" type="button" data-act="mes-nav" data-d="0">Hoje</button>' +
      '<button class="btn sm" type="button" data-act="mes-nav" data-d="1">Próximo mês →</button>' +
      '</div></div>' +
      '<p class="muted">' + esc(tituloMes) + '</p>' +
      legendaProfs() +
      '<div class="mes-cabecalho">' + L.DIAS_ORDEM.map(function (d) { return '<div>' + d + '</div>'; }).join('') + '</div>' +
      '<div class="mes-grade">' + celulas + '</div>' +
      '<p class="muted">Toque em um dia para ver as turmas e compromissos daquele dia.</p>';
  }

  /* ---------- Turmas ---------- */
  function viewTurmas() {
    let lista = S.turmas.filter(function (t) { return t.semestre === V.semestre; });
    if (V.fSit) lista = lista.filter(function (t) { return t.situacao === V.fSit; });
    if (V.fProf) lista = lista.filter(function (t) { return L.norm(t.professor) === L.norm(V.fProf); });
    const doSemestre = S.turmas.filter(function (t) { return t.semestre === V.semestre; });
    const situacoes = Array.from(new Set(doSemestre.map(function (t) { return t.situacao; }))).filter(Boolean).sort();
    const professores = Array.from(new Set(doSemestre.map(function (t) { return t.professor; }))).filter(Boolean).sort(function (a, b) { return L.norm(a).localeCompare(L.norm(b)); });
    const semBtns = D.semestres.map(function (s) { return '<button class="btn sm' + (V.semestre === s ? ' on' : '') + '" type="button" data-act="semestre" data-s="' + s + '">' + esc(s) + '</button>'; }).join('');
    const encerram = lista.filter(function (t) { return t.encerraProxSemestre; });
    return '<div class="topo"><h1>Turmas</h1><div class="topo-acoes">' + semBtns + '<button class="btn sm on" type="button" data-act="nova-turma">+ Nova turma</button></div></div>' +
      '<div class="filtros">' +
      '<select data-act="filtro-sit"><option value="">Todas as situações</option>' + situacoes.map(function (s) { return '<option value="' + esc(s) + '"' + (V.fSit === s ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select>' +
      '<select data-act="filtro-prof-turma"><option value="">Todos os professores</option>' + professores.map(function (p) { return '<option value="' + esc(p) + '"' + (V.fProf === p ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>' +
      '<span class="muted">' + lista.length + ' turma(s)' + (encerram.length ? (' · ' + encerram.length + ' encerram no próximo semestre') : '') + '</span>' +
      '</div>' +
      '<div class="lista-cards">' + lista.map(function (t) { return cardTurma(t); }).join('') + '</div>';
  }

  function dlgTurma(id) {
    const t = D.turmaPorId[id];
    if (!t) return;
    const alunosDaTurma = (t.alunosNomes || []).map(function (nomeRaw) {
      const key = L.norm(nomeRaw.replace(/\s*[\(\*].*$/, '').replace(/\*$/, ''));
      const aluno = S.alunos.find(function (a) { return L.norm(a.nome) === key; });
      return { nomeRaw: nomeRaw, aluno: aluno };
    }).sort(function (x, y) { return L.norm(x.aluno ? x.aluno.nome : x.nomeRaw).localeCompare(L.norm(y.aluno ? y.aluno.nome : y.nomeRaw)); });
    const idsNaTurma = {};
    alunosDaTurma.forEach(function (x) { if (x.aluno) idsNaTurma[x.aluno.id] = true; });
    const candidatosAdicionar = S.alunos.filter(function (a) { return !idsNaTurma[a.id]; })
      .sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    abrirDlg('<article class="dlg-card"><header><h2>' + esc(t.turma) + '</h2><button class="x" data-act="fechar" aria-label="Fechar">✕</button></header>' +
      '<div class="dlg-corpo">' +
      '<p>' + esc(t.dia) + ' · ' + esc(t.horario) + (t.sala ? (' · ' + esc(t.sala)) : '') + ' · Professor(a): ' + esc(t.professor || '—') + '</p>' +
      '<p>' + sitBadge(t.situacao) + (t.encerraProxSemestre ? ' <span class="tag tag-aviso">Encerra no próximo semestre</span>' : '') + ' ' + vagasTag(alunosDaTurma.length) + '</p>' +
      (t.obs ? ('<p class="muted">Obs.: ' + esc(t.obs) + '</p>') : '') +
      '<h3>Alunos (' + alunosDaTurma.length + ')</h3>' +
      (alunosDaTurma.length ? ('<ul class="lista-alunos">' + alunosDaTurma.map(function (x) {
        return '<li class="aluno-turma-linha' + (x.aluno && x.aluno.cancelado ? ' linha-cancelada' : '') + '"><div>' + esc(x.aluno ? x.aluno.nome : x.nomeRaw) + (x.aluno && x.aluno.cancelado ? ' <span class="tag tag-erro">Cancelado</span>' : '') + (x.aluno && x.aluno.telefone ? ('<span class="muted"> · ' + esc(x.aluno.telefone) + '</span>') : (!x.aluno ? '<span class="muted"> · sem cadastro de aluno</span>' : '')) + '</div>' +
          '<div class="aluno-turma-acoes">' +
          (x.aluno ? '<button class="link" type="button" data-act="ver-aluno" data-id="' + x.aluno.id + '">ver cadastro</button>' : '') +
          (x.aluno && x.aluno.telefone ? ('<a class="btn sm" target="_blank" rel="noopener" href="' + L.linkWhatsApp(x.aluno.telefone, '') + '">WhatsApp</a>') : '') +
          (x.aluno ? ('<button class="btn sm" type="button" data-act="turma-remover-aluno" data-turma="' + t.id + '" data-aluno="' + x.aluno.id + '">Remover da turma</button>') : '') +
          '</div></li>';
      }).join('') + '</ul>') : '<p class="muted">Nenhum aluno registrado nesta turma.</p>') +
      (candidatosAdicionar.length ? ('<div class="campo"><label>Adicionar aluno já cadastrado a esta turma</label>' +
        '<div class="aluno-turma-acoes">' +
        '<select id="add-aluno-turma-select"><option value="">Selecione um aluno…</option>' +
        candidatosAdicionar.map(function (a) { return '<option value="' + a.id + '">' + esc(a.nome) + '</option>'; }).join('') + '</select>' +
        '<button class="btn sm" type="button" data-act="turma-adicionar-aluno" data-turma="' + t.id + '">Adicionar</button>' +
        '</div></div>') : '') +
      '<div class="ct-acoes">' +
      '<button class="btn sm" type="button" data-act="editar-turma" data-id="' + t.id + '">Editar turma</button>' +
      '<button class="btn sm" type="button" data-act="baixar-ics" data-id="' + t.id + '">Baixar .ics</button>' +
      (linkGoogleCalendar(t) ? ('<a class="btn sm" target="_blank" rel="noopener" href="' + linkGoogleCalendar(t) + '">Adicionar ao Google Agenda</a>') : '') +
      '</div></div></article>');
  }

  /* ---------- Criar / editar / excluir turma ---------- */
  const SITUACOES_TURMA = ['Em andamento', 'Em formação', 'A confirmar', 'Finalizada', 'Não formou turma'];
  function dlgEditarTurma(id) {
    const t = id ? D.turmaPorId[id] : null;
    abrirDlg('<article class="dlg-card"><header><h2>' + (t ? 'Editar turma' : 'Nova turma') + '</h2><button class="x" data-act="fechar" aria-label="Fechar">✕</button></header>' +
      '<div class="dlg-corpo">' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Nome da turma</label><input type="text" id="et-turma" value="' + esc(t ? t.turma : '') + '" placeholder="Ex.: Kids 5"></div>' +
      '<div class="campo"><label>Semestre</label><input type="text" id="et-semestre" value="' + esc(t ? t.semestre : V.semestre) + '" placeholder="Ex.: 2026.2"></div>' +
      '<div class="campo"><label>Dia(s) da semana</label><input type="text" id="et-dia" value="' + esc(t ? t.dia : '') + '" placeholder="Ex.: SEG/QUA"></div>' +
      '<div class="campo"><label>Horário</label><input type="text" id="et-horario" value="' + esc(t ? t.horario : '') + '" placeholder="Ex.: 18h - 19h"></div>' +
      '<div class="campo"><label>Professor(a)</label><input type="text" id="et-professor" value="' + esc(t ? (t.professor || '') : '') + '" placeholder="Nome do(a) professor(a)"></div>' +
      '<div class="campo"><label>Sala</label><input type="text" id="et-sala" value="' + esc(t ? (t.sala || '') : '') + '" placeholder="Ex.: Sala 2"></div>' +
      '<div class="campo"><label>Situação</label><select id="et-situacao">' + SITUACOES_TURMA.map(function (s) { return '<option value="' + esc(s) + '"' + (t && t.situacao === s ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div>' +
      '</div>' +
      '<div class="campo"><label>Observação</label><input type="text" id="et-obs" value="' + esc(t ? (t.obs || '') : '') + '" placeholder="Opcional"></div>' +
      '<div class="ct-acoes">' +
      '<button class="btn sm on" type="button" data-act="salvar-turma" data-id="' + (t ? t.id : '') + '">Salvar</button>' +
      (t ? ('<button class="btn sm" type="button" data-act="excluir-turma" data-id="' + t.id + '">Excluir turma</button>') : '') +
      '</div></div></article>');
  }

  /* ---------- Matrículas ---------- */
  function checklistCompleta(m) {
    return !!(m.checklist.sistemaWashington && m.checklist.contratoAssinado && m.checklist.materialCobrado && (m.formaPagamento === 'unidade' || m.checklist.boletoAsaas));
  }
  const fmtReais = function (v) { const n = Number(normalizarValorMoeda(v)); return (v === '' || v == null || isNaN(n)) ? '' : 'R$ ' + n.toFixed(2).replace('.', ','); };

  function cardMatricula(m) {
    const t = D.turmaPorId[m.turmaId];
    const dias = L.diasAte(m.contratoFim);
    const completa = checklistCompleta(m);
    let tagContrato = '<span class="tag tag-ok">Contrato em dia</span>';
    if (dias != null) {
      if (dias < 0) tagContrato = '<span class="tag tag-erro">Contrato venceu há ' + Math.abs(dias) + ' dia(s)</span>';
      else if (dias <= 30) tagContrato = '<span class="tag tag-aviso">Rematrícula em ' + dias + ' dia(s)</span>';
    }
    return '<div class="card-turma" data-matricula="' + m.id + '">' +
      '<div class="ct-topo"><b>' + esc(m.alunoNome) + '</b>' + (completa ? '<span class="tag tag-ok">Checklist completo</span>' : '<span class="tag tag-aviso">Checklist pendente</span>') + '</div>' +
      '<div class="ct-linha">Turma: ' + esc(t ? t.turma : m.turmaNome) + (t ? (' · ' + esc(t.dia) + ' ' + esc(t.horario)) : '') + '</div>' +
      '<div class="ct-linha">Início: ' + esc(m.dataInicio) + ' · Contrato até ' + esc(m.contratoFim) + ' ' + tagContrato + '</div>' +
      '<div class="ct-linha">Pagamento: ' + (m.formaPagamento === 'unidade' ? 'Na unidade' : 'Asaas') + (m.dataPagamento ? (' · pago em ' + esc(m.dataPagamento)) : '') + '</div>' +
      '<div class="ct-linha">Mensalidade: ' + (fmtReais(m.valorMensalidade) || '—') + (m.desconto && m.desconto.tem ? ('<span class="tag tag-aviso">Desconto no 1º mês' + (m.desconto.valor ? (': ' + esc(fmtReais(m.desconto.valor))) : '') + '</span>') : '') + '</div>' +
      (m.desconto && m.desconto.tem && m.desconto.obs ? ('<div class="ct-linha muted">Obs. desconto: ' + esc(m.desconto.obs) + '</div>') : '') +
      '<div class="ct-linha">Material: ' + esc(m.livro || '—') + (m.valorMaterial ? (' · ' + esc(fmtReais(m.valorMaterial))) : '') + '</div>' +
      '<div class="check"><label><input type="checkbox" data-act="chk-matricula" data-id="' + m.id + '" data-campo="sistemaWashington"' + (m.checklist.sistemaWashington ? ' checked' : '') + '> Subiu matrícula no sistema da Washington</label></div>' +
      (m.formaPagamento === 'unidade' ? '' : ('<div class="check"><label><input type="checkbox" data-act="chk-matricula" data-id="' + m.id + '" data-campo="boletoAsaas"' + (m.checklist.boletoAsaas ? ' checked' : '') + '> Subiu boleto no Asaas</label></div>')) +
      '<div class="check"><label><input type="checkbox" data-act="chk-matricula" data-id="' + m.id + '" data-campo="contratoAssinado"' + (m.checklist.contratoAssinado ? ' checked' : '') + '> Responsável assinou o contrato</label></div>' +
      '<div class="check"><label><input type="checkbox" data-act="chk-matricula" data-id="' + m.id + '" data-campo="materialCobrado"' + (m.checklist.materialCobrado ? ' checked' : '') + '> Cobrado para comprar o material/livro</label></div>' +
      '<div class="campo"><label>Livro didático</label><input type="text" data-act="livro-matricula" data-id="' + m.id + '" value="' + esc(m.livro || '') + '" placeholder="Qual livro o aluno precisa comprar"></div>' +
      '<div class="ct-acoes">' +
      (D.alunoPorId[m.alunoId] && D.alunoPorId[m.alunoId].telefone ? ('<a class="btn sm" target="_blank" rel="noopener" href="' + L.linkWhatsApp(D.alunoPorId[m.alunoId].telefone, L.mensagemMaterialDidatico(D.alunoPorId[m.alunoId], t, m.livro)) + '">Avisar sobre o livro</a>' +
        '<button class="btn sm' + (D.alunoPorId[m.alunoId].materialDidatico.enviado ? ' on-ok' : '') + '" type="button" data-act="marcar-material" data-id="' + m.alunoId + '">' + (D.alunoPorId[m.alunoId].materialDidatico.enviado ? '✓ Avisado' : '✓ Marcar como avisado') + '</button>') : '<span class="muted">Cadastre o telefone do aluno para avisar sobre o livro</span>') +
      '<button class="btn sm" type="button" data-act="editar-matricula" data-id="' + m.id + '">Editar matrícula</button>' +
      (dias != null && dias <= 30 ? ('<button class="btn sm on" type="button" data-act="renovar-matricula" data-id="' + m.id + '">Renovar matrícula</button>') : '') +
      '<button class="btn sm" type="button" data-act="excluir-matricula" data-id="' + m.id + '">Excluir matrícula</button>' +
      '</div></div>';
  }

  /* Edição de uma matrícula já lançada (corrige erro de preenchimento num rascunho, por exemplo). */

    const m = D.matriculaPorId[id];
    if (!m) return;
    abrirDlg('<article class="dlg-card"><header><h2>Editar matrícula — ' + esc(m.alunoNome) + '</h2><button class="x" data-act="fechar" aria-label="Fechar">✕</button></header>' +
      '<div class="dlg-corpo">' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Turma</label><select id="em-turma">' + S.turmas.slice().sort(function (a, b) { return L.norm(a.turma).localeCompare(L.norm(b.turma)); })
        .map(function (t) { return '<option value="' + t.id + '"' + (m.turmaId === t.id ? ' selected' : '') + '>' + esc(t.turma) + ' · ' + esc(t.semestre) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>Data de início</label><input type="date" id="em-data" value="' + esc(m.dataInicio) + '"></div>' +
      '<div class="campo"><label>Data de pagamento</label><input type="date" id="em-data-pagamento" value="' + esc(m.dataPagamento || '') + '"></div>' +
      '<div class="campo"><label>Pagamento</label><select id="em-pagamento"><option value="asaas"' + (m.formaPagamento !== 'unidade' ? ' selected' : '') + '>Pelo Asaas</option><option value="unidade"' + (m.formaPagamento === 'unidade' ? ' selected' : '') + '>Na unidade</option></select></div>' +
      '<div class="campo"><label>Valor da mensalidade (R$)</label><input type="text" inputmode="decimal" id="em-valor-mensalidade" value="' + esc(m.valorMensalidade || '') + '"></div>' +
      '<div class="campo"><label>Livro didático (qual)</label><input type="text" id="em-livro" value="' + esc(m.livro || '') + '"></div>' +
      '<div class="campo"><label>Valor do material (R$)</label><input type="text" inputmode="decimal" id="em-valor-material" value="' + esc(m.valorMaterial || '') + '"></div>' +
      '</div>' +
      '<div class="check"><label><input type="checkbox" id="em-desconto-tem"' + (m.desconto && m.desconto.tem ? ' checked' : '') + '> Teve desconto especial no primeiro mês</label></div>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Valor com desconto (R$)</label><input type="text" inputmode="decimal" id="em-desconto-valor" value="' + esc(m.desconto ? (m.desconto.valor || '') : '') + '"></div>' +
      '<div class="campo"><label>Observação do desconto</label><input type="text" id="em-desconto-obs" value="' + esc(m.desconto ? (m.desconto.obs || '') : '') + '"></div>' +
      '</div>' +
      '<div class="ct-acoes"><button class="btn sm on" type="button" data-act="salvar-matricula" data-id="' + m.id + '">Salvar</button></div>' +
      '</div></article>');
  }

  function viewMatriculas() {
    const turmasDoSemestre = S.turmas.filter(function (t) { return t.semestre === V.semestre; });
    const opcoesAluno = S.alunos.slice().sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    const pendentes = S.matriculas.filter(function (m) { return !checklistCompleta(m); });
    const completas = S.matriculas.filter(checklistCompleta);
    const nm = V.novaMatricula;
    return '<div class="topo"><h1>Matrículas</h1></div>' +
      '<section class="bloco">' +
      '<h2>Registrar nova matrícula</h2>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Aluno (já cadastrado)</label><select data-act="nm-aluno"><option value="">— Novo aluno —</option>' +
      opcoesAluno.map(function (a) { return '<option value="' + a.id + '"' + (nm.alunoId === a.id ? ' selected' : '') + '>' + esc(a.nome) + '</option>'; }).join('') + '</select></div>' +
      (!nm.alunoId ? (
        '<div class="campo"><label>Nome do novo aluno</label><input type="text" data-act="nm-nome" value="' + esc(nm.alunoNome) + '" placeholder="Nome completo"></div>' +
        '<div class="campo"><label>RG</label><input type="text" data-act="nm-rg" value="' + esc(nm.rg) + '" placeholder="Ex.: 12117893-3"></div>' +
        '<div class="campo"><label>CPF</label><input type="text" data-act="nm-cpf" value="' + esc(nm.cpf) + '" placeholder="Ex.: 102.424.037-19"></div>' +
        '<div class="campo"><label>Data de nascimento</label><input type="date" data-act="nm-data-nascimento" value="' + esc(nm.dataNascimento) + '"></div>' +
        '<div class="campo"><label>Endereço completo</label><input type="text" data-act="nm-endereco" value="' + esc(nm.endereco) + '" placeholder="Rua, número, bloco/apto"></div>' +
        '<div class="campo"><label>CEP</label><input type="text" data-act="nm-cep" value="' + esc(nm.cep) + '" placeholder="Ex.: 21911-180"></div>' +
        '<div class="campo"><label>Dia de vencimento</label><input type="text" inputmode="numeric" data-act="nm-dia-vencimento" value="' + esc(nm.diaVencimento) + '" placeholder="Ex.: 20"></div>'
      ) : '') +
      '<div class="campo"><label>Turma (semestre ' + esc(V.semestre) + ')</label><select data-act="nm-turma"><option value="">Selecione…</option>' +
      turmasDoSemestre.map(function (t) { return '<option value="' + t.id + '"' + (nm.turmaId === t.id ? ' selected' : '') + '>' + esc(t.turma) + ' · ' + esc(t.dia) + ' ' + esc(t.horario) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>Data de início</label><input type="date" data-act="nm-data" value="' + esc(nm.dataInicio) + '"></div>' +
      '<div class="campo"><label>Data de pagamento</label><input type="date" data-act="nm-data-pagamento" value="' + esc(nm.dataPagamento) + '"></div>' +
      '<div class="campo"><label>Pagamento</label><select data-act="nm-pagamento"><option value="asaas"' + (nm.formaPagamento !== 'unidade' ? ' selected' : '') + '>Pelo Asaas</option><option value="unidade"' + (nm.formaPagamento === 'unidade' ? ' selected' : '') + '>Na unidade</option></select></div>' +
      '<div class="campo"><label>Valor da mensalidade (R$)</label><input type="text" inputmode="decimal" data-act="nm-valor-mensalidade" value="' + esc(nm.valorMensalidade) + '" placeholder="Ex.: 207.00"></div>' +
      '<div class="campo"><label>Livro didático (qual)</label><input type="text" data-act="nm-livro" value="' + esc(nm.livro) + '" placeholder="Nome do livro"></div>' +
      '<div class="campo"><label>Valor do material (R$)</label><input type="text" inputmode="decimal" data-act="nm-valor-material" value="' + esc(nm.valorMaterial) + '" placeholder="Ex.: 298.20"></div>' +
      '</div>' +
      '<div class="check"><label><input type="checkbox" data-act="nm-desconto-tem"' + (nm.descontoTem ? ' checked' : '') + '> Teve desconto especial no primeiro mês</label></div>' +
      (nm.descontoTem ? ('<div class="campos-matricula">' +
        '<div class="campo"><label>Valor com desconto (R$)</label><input type="text" inputmode="decimal" data-act="nm-desconto-valor" value="' + esc(nm.descontoValor) + '" placeholder="Valor cobrado no 1º mês"></div>' +
        '<div class="campo"><label>Observação do desconto</label><input type="text" data-act="nm-desconto-obs" value="' + esc(nm.descontoObs) + '" placeholder="Ex.: promoção de matrícula"></div>' +
        '</div>') : '') +
      (nm.dataInicio ? ('<p class="muted">Contrato semestral: de ' + esc(nm.dataInicio) + ' até ' + esc(L.fimContrato(nm.dataInicio)) + '. Na virada, é preciso fazer a rematrícula e refazer o contrato.</p>') : '') +
      '<button class="btn on" type="button" data-act="add-matricula">Registrar matrícula</button>' +
      '</section>' +
      '<h2 class="subtitulo">Checklist pendente (' + pendentes.length + ')</h2>' +
      (pendentes.length ? ('<div class="lista-cards">' + pendentes.map(cardMatricula).join('') + '</div>') : '<p class="muted">Nenhuma matrícula pendente.</p>') +
      '<h2 class="subtitulo">Checklist completo (' + completas.length + ')</h2>' +
      (completas.length ? ('<div class="lista-cards">' + completas.map(cardMatricula).join('') + '</div>') : '<p class="muted">Nenhuma ainda.</p>');
  }

  /* ---------- Compromissos (reuniões, agenda com pais/responsáveis) ---------- */
  const QUEM_OPCOES = ['Isa', 'Camila', 'Isa e Camila'];
  function opcoesQuemTodas() {
    const profs = S.professores.map(function (p) { return p.nome; });
    return Array.from(new Set(QUEM_OPCOES.concat(profs)));
  }
  function statusCompromissoBadge(c) {
    if (c.status === 'realizado') return '<span class="tag tag-ok">Realizado</span>';
    if (c.status === 'cancelado') return '<span class="tag tag-neutro">Cancelado</span>';
    if (c.data && c.data < HOJE) return '<span class="tag tag-erro">Atrasado</span>';
    if (c.data === HOJE) return '<span class="tag tag-aviso">Hoje</span>';
    return '<span class="tag tag-neutro">Agendado</span>';
  }
  function dlgEditarCompromisso(id) {
    const c = S.compromissos.find(function (x) { return x.id === id; });
    if (!c) return;
    abrirDlg('<article class="dlg-card"><header><h2>Editar compromisso</h2><button class="x" data-act="fechar" aria-label="Fechar">✕</button></header>' +
      '<div class="dlg-corpo">' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Título</label><input type="text" id="ec-titulo" value="' + esc(c.titulo || '') + '"></div>' +
      '<div class="campo"><label>Com quem</label><input type="text" list="lista-quem" id="ec-comquem" value="' + esc(c.comQuem || '') + '"></div>' +
      '<div class="campo"><label>Data</label><input type="date" id="ec-data" value="' + esc(c.data || '') + '"></div>' +
      '<div class="campo"><label>Horário</label><input type="text" id="ec-horario" value="' + esc(c.horario || '') + '" placeholder="Ex.: 14h30"></div>' +
      '<div class="campo"><label>Local</label><input type="text" id="ec-local" value="' + esc(c.local || '') + '"></div>' +
      '</div>' +
      '<div class="campo"><label>Observação</label><input type="text" id="ec-obs" value="' + esc(c.obs || '') + '" placeholder="Pauta, contexto…"></div>' +
      '<div class="ct-acoes"><button class="btn sm on" type="button" data-act="salvar-compromisso" data-id="' + c.id + '">Salvar</button></div>' +
      '</div></article>');
  }
  function cardCompromisso(c) {
    const aluno = c.alunoId ? D.alunoPorId[c.alunoId] : null;
    const nomeResp = aluno ? aluno.nome : c.alunoNome;
    return '<div class="card-turma" data-compromisso="' + c.id + '">' +
      '<div class="ct-topo"><b>' + esc(c.titulo) + '</b>' + statusCompromissoBadge(c) + '</div>' +
      '<div class="ct-linha">' + esc(L.fmtLonga(c.data)) + (c.horario ? (' às ' + esc(c.horario)) : '') + '</div>' +
      '<div class="ct-linha">Com: ' + esc(c.comQuem || '—') + (nomeResp ? (' · ' + esc(nomeResp)) : '') + (c.local ? (' · ' + esc(c.local)) : '') + '</div>' +
      (c.obs ? ('<div class="ct-linha muted">' + esc(c.obs) + '</div>') : '') +
      '<div class="ct-acoes">' +
      '<button class="btn sm" type="button" data-act="editar-compromisso" data-id="' + c.id + '">Editar</button>' +
      (c.status === 'agendado' ? ('<button class="btn sm" type="button" data-act="compromisso-status" data-id="' + c.id + '" data-st="realizado">Marcar realizado</button>' +
        '<button class="btn sm" type="button" data-act="compromisso-status" data-id="' + c.id + '" data-st="cancelado">Cancelar</button>') :
        '<button class="btn sm" type="button" data-act="compromisso-status" data-id="' + c.id + '" data-st="agendado">Reabrir</button>') +
      '<button class="btn sm" type="button" data-act="baixar-ics-compromisso" data-id="' + c.id + '">Baixar .ics</button>' +
      (aluno && aluno.telefone ? ('<a class="btn sm" target="_blank" rel="noopener" href="' + L.linkWhatsApp(aluno.telefone, L.mensagemConfirmacaoCompromisso(c, aluno.nome)) + '">Confirmar no WhatsApp</a>') : '') +
      '<button class="btn sm" type="button" data-act="excluir-compromisso" data-id="' + c.id + '">Excluir</button>' +
      '</div></div>';
  }
  function viewCompromissos() {
    const nc = V.novoCompromisso;
    const opcoesAluno = S.alunos.slice().sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    const todos = S.compromissos.slice().sort(function (a, b) { return (a.data + (a.horario || '')).localeCompare(b.data + (b.horario || '')); });
    const agendados = todos.filter(function (c) { return c.status === 'agendado'; });
    const hoje = agendados.filter(function (c) { return c.data === HOJE; });
    const atrasados = agendados.filter(function (c) { return c.data < HOJE; });
    const proximos = agendados.filter(function (c) { return c.data > HOJE; });
    const encerrados = todos.filter(function (c) { return c.status !== 'agendado'; });
    return '<div class="topo"><h1>Compromissos</h1></div>' +
      (notificacoesSuportadas() ? ('<section class="bloco">' +
        '<h2>Notificação de novo compromisso</h2>' +
        (notificacoesAtivadas() ?
          ('<p class="muted">✓ Notificações ativadas neste navegador — quando alguém (de qualquer aparelho, com a sincronização ligada) agendar um compromisso, aparece um aviso aqui, enquanto esta aba estiver aberta.</p>' +
            '<button class="btn sm" type="button" data-act="testar-notificacao-compromisso">Testar notificação</button>') :
          (Notification.permission === 'denied' ?
            '<p class="muted">As notificações deste navegador foram bloqueadas. Pra ativar, abra as configurações do site (ícone ao lado do endereço) e permita notificações — depois recarregue a página.</p>' :
            ('<p class="muted">Ative pra ser avisada direto neste navegador sempre que alguém agendar um compromisso novo (precisa deixar a aba aberta e, se usar sincronização entre aparelhos, estar logada).</p>' +
              '<button class="btn sm on" type="button" data-act="ativar-notificacoes-compromisso">Ativar notificações</button>'))) +
        '</section>') : '') +
      '<section class="bloco">' +
      '<h2>Agendar compromisso</h2>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Título</label><input type="text" data-act="nc-titulo" value="' + esc(nc.titulo) + '" placeholder="Ex.: Reunião com os pais da Fulana"></div>' +
      '<div class="campo"><label>Aluno (opcional)</label><select data-act="nc-aluno"><option value="">— Nenhum / outro —</option>' +
      opcoesAluno.map(function (a) { return '<option value="' + a.id + '"' + (nc.alunoId === a.id ? ' selected' : '') + '>' + esc(a.nome) + '</option>'; }).join('') + '</select></div>' +
      (!nc.alunoId ? '<div class="campo"><label>Nome (se não for aluno cadastrado)</label><input type="text" data-act="nc-nome" value="' + esc(nc.alunoNome) + '" placeholder="Ex.: responsável, visitante…"></div>' : '') +
      '<div class="campo"><label>Com quem</label><input type="text" list="lista-quem" data-act="nc-comquem" value="' + esc(nc.comQuem) + '" placeholder="Ex.: Isa, Camila, Isa e Camila, um(a) professor(a)…"></div>' +
      '<div class="campo"><label>Data</label><input type="date" data-act="nc-data" value="' + esc(nc.data) + '"></div>' +
      '<div class="campo"><label>Horário</label><input type="text" data-act="nc-horario" value="' + esc(nc.horario) + '" placeholder="Ex.: 14h30"></div>' +
      '<div class="campo"><label>Local</label><input type="text" data-act="nc-local" value="' + esc(nc.local) + '" placeholder="Ex.: Sala da coordenação, Google Meet…"></div>' +
      '</div>' +
      '<div class="campo"><label>Observação</label><input type="text" data-act="nc-obs" value="' + esc(nc.obs) + '" placeholder="Pauta, contexto…"></div>' +
      '<datalist id="lista-quem">' + opcoesQuemTodas().map(function (q) { return '<option value="' + esc(q) + '">'; }).join('') + '</datalist>' +
      '<button class="btn on" type="button" data-act="add-compromisso">Agendar</button>' +
      '</section>' +
      (hoje.length ? ('<h2 class="subtitulo">Hoje (' + hoje.length + ')</h2><div class="lista-cards">' + hoje.map(cardCompromisso).join('') + '</div>') : '') +
      (atrasados.length ? ('<h2 class="subtitulo">Atrasados (' + atrasados.length + ')</h2><div class="lista-cards">' + atrasados.map(cardCompromisso).join('') + '</div>') : '') +
      '<h2 class="subtitulo">Próximos (' + proximos.length + ')</h2>' +
      (proximos.length ? ('<div class="lista-cards">' + proximos.map(cardCompromisso).join('') + '</div>') : '<p class="muted">Nenhum compromisso futuro agendado.</p>') +
      (encerrados.length ? ('<h2 class="subtitulo">Realizados / cancelados (' + encerrados.length + ')</h2><div class="lista-cards">' + encerrados.map(cardCompromisso).join('') + '</div>') : '');
  }

  /* ---------- Frequência (chamada por turma/aula) ---------- */
  function alunosDaTurma(turmaId) {
    return S.alunos.filter(function (a) { return (a.turmas || []).some(function (x) { return x.turmaId === turmaId; }); })
      .sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
  }
  function carregarChamadaForm() {
    V.chamadaPresencas = {};
    if (!V.chamadaTurmaId) return;
    const existente = D.chamadaPorChave[V.chamadaTurmaId + '|' + V.chamadaData];
    if (existente) {
      // só entram aqui os alunos que já tinham sido marcados (presente ou falta) nessa chamada;
      // quem não tiver marcação fica em branco mesmo, pra equipe marcar.
      Object.keys(existente.presencas || {}).forEach(function (id) { V.chamadaPresencas[id] = existente.presencas[id]; });
    }
  }
  /* Relatório de frequência de um mês (AAAA-MM): uma linha por aluno+turma, somando presenças e
     faltas das chamadas registradas naquele mês — pra baixar em CSV sem precisar abrir aluno por
     aluno. */
  function relatorioFrequenciaMes(ym) {
    const chamadasMes = S.frequencias.filter(function (c) { return mesDeData(c.data) === ym; });
    const porAlunoTurma = {};
    chamadasMes.forEach(function (c) {
      Object.keys(c.presencas || {}).forEach(function (alunoId) {
        const chave = alunoId + '|' + c.turmaId;
        if (!porAlunoTurma[chave]) porAlunoTurma[chave] = { alunoId: alunoId, turmaId: c.turmaId, presencas: 0, faltas: 0 };
        if (c.presencas[alunoId]) porAlunoTurma[chave].presencas++; else porAlunoTurma[chave].faltas++;
      });
    });
    return Object.keys(porAlunoTurma).map(function (k) { return porAlunoTurma[k]; }).map(function (x) {
      const aluno = D.alunoPorId[x.alunoId];
      const turma = D.turmaPorId[x.turmaId];
      const total = x.presencas + x.faltas;
      return {
        nome: aluno ? aluno.nome : '(aluno excluído)', turma: turma ? turma.turma : '(turma excluída)',
        presencas: x.presencas, faltas: x.faltas, total: total, pct: total ? Math.round((x.presencas / total) * 100) : 0,
      };
    }).sort(function (a, b) { return L.norm(a.turma).localeCompare(L.norm(b.turma)) || L.norm(a.nome).localeCompare(L.norm(b.nome)); });
  }
  function viewFrequencia() {
    const turmasDoSemestre = S.turmas.filter(function (t) { return t.semestre === V.semestre; });
    const semBtns = D.semestres.map(function (s) { return '<button class="btn sm' + (V.semestre === s ? ' on' : '') + '" type="button" data-act="semestre" data-s="' + s + '">' + esc(s) + '</button>'; }).join('');
    const turmaSel = D.turmaPorId[V.chamadaTurmaId];
    const alunosTurma = turmaSel ? alunosDaTurma(turmaSel.id) : [];
