    const diaData = V.chamadaData ? L.diaDaSemana(V.chamadaData) : '';
    const diasTurma = turmaSel ? L.diasDaTurma(turmaSel.dia) : [];
    const diaConfere = !turmaSel || !V.chamadaData || diasTurma.indexOf(diaData) > -1;
    const existente = turmaSel ? D.chamadaPorChave[turmaSel.id + '|' + V.chamadaData] : null;
    const naoMarcados = alunosTurma.filter(function (a) { return V.chamadaPresencas[a.id] === undefined; }).length;
    const linhasAlunos = alunosTurma.map(function (a) {
      const valor = V.chamadaPresencas[a.id]; // true = presente, false = faltou, undefined = em branco
      const resumo = L.resumoFrequencia(S.frequencias, a.id);
      return '<div class="chamada-linha">' +
        '<span class="chamada-nome">' + esc(a.nome) + (resumo.total ? ('<span class="muted"> · ' + resumo.pct + '% presença (' + resumo.total + ' chamada(s))</span>') : '') + '</span>' +
        '<div class="chamada-botoes">' +
        '<button type="button" class="btn sm' + (valor === true ? ' on' : '') + '" data-act="fr-marcar" data-id="' + a.id + '" data-v="presente">Presente</button>' +
        '<button type="button" class="btn sm' + (valor === false ? ' on-erro' : '') + '" data-act="fr-marcar" data-id="' + a.id + '" data-v="falta">Faltou</button>' +
        '</div></div>';
    }).join('');
    const historico = turmaSel ? S.frequencias.filter(function (c) { return c.turmaId === turmaSel.id; }).sort(function (a, b) { return b.data.localeCompare(a.data); }) : [];
    const idsComChamada = Array.from(new Set(S.frequencias.reduce(function (acc, c) { return acc.concat(Object.keys(c.presencas || {})); }, [])));
    const alertas = idsComChamada.map(function (id) {
      const a = D.alunoPorId[id];
      if (!a) return null;
      const r = L.resumoFrequencia(S.frequencias, id);
      return (r.total >= 3 && r.pct < 75) ? { aluno: a, resumo: r } : null;
    }).filter(Boolean).sort(function (x, y) { return x.resumo.pct - y.resumo.pct; });
    /* Faltas acumuladas no semestre selecionado (não é alerta de risco, é a contagem bruta por
       aluno — sinal de quem está acumulando faltas antes de virar um problema de evasão). */
    const turmaIdsSemestre = {};
    turmasDoSemestre.forEach(function (t) { turmaIdsSemestre[t.id] = true; });
    const chamadasSemestre = S.frequencias.filter(function (c) { return turmaIdsSemestre[c.turmaId]; });
    const idsComChamadaSemestre = Array.from(new Set(chamadasSemestre.reduce(function (acc, c) { return acc.concat(Object.keys(c.presencas || {})); }, [])));
    const faltasPorAluno = idsComChamadaSemestre.map(function (id) {
      const a = D.alunoPorId[id];
      if (!a) return null;
      const r = L.resumoFrequencia(chamadasSemestre, id);
      return r.faltas > 0 ? { aluno: a, resumo: r } : null;
    }).filter(Boolean).sort(function (x, y) { return y.resumo.faltas - x.resumo.faltas; });
    const mesesFreq = Array.from(new Set(S.frequencias.map(function (c) { return mesDeData(c.data); }).filter(Boolean).concat([mesDeData(HOJE)]))).sort().reverse();
    const relatorioMes = relatorioFrequenciaMes(V.fMesFrequencia);
    return '<div class="topo"><h1>Frequência</h1><div class="topo-acoes">' + semBtns + '</div></div>' +
      '<section class="bloco">' +
      '<h2>Fazer chamada</h2>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Turma (semestre ' + esc(V.semestre) + ')</label><select data-act="fr-turma"><option value="">Selecione…</option>' +
      turmasDoSemestre.map(function (t) { return '<option value="' + t.id + '"' + (V.chamadaTurmaId === t.id ? ' selected' : '') + '>' + esc(t.turma) + ' · ' + esc(t.dia) + ' ' + esc(t.horario) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>Data da aula</label><input type="date" data-act="fr-data" value="' + esc(V.chamadaData) + '"></div>' +
      '</div>' +
      (turmaSel && !diaConfere ? ('<p class="muted">Atenção: ' + esc(L.fmtCurta(V.chamadaData)) + ' cai numa ' + esc((L.DIAS_FULL[diaData] || diaData).toLowerCase()) + ', mas essa turma é ' + esc(turmaSel.dia) + '. Confira a data antes de salvar.</p>') : '') +
      (turmaSel ? ((alunosTurma.length ? linhasAlunos : '<p class="muted">Nenhum aluno cadastrado nesta turma.</p>') +
        (naoMarcados ? ('<p class="muted">Faltam marcar ' + naoMarcados + ' aluno(s).</p>') : '') +
        '<button class="btn on" type="button" data-act="salvar-chamada">' + (existente ? 'Atualizar chamada' : 'Salvar chamada') + '</button>') : '<p class="muted">Escolha uma turma para fazer a chamada.</p>') +
      '</section>' +
      (turmaSel && historico.length ? ('<h2 class="subtitulo">Histórico desta turma (' + historico.length + ')</h2><ul class="lista-log">' +
        historico.map(function (c) {
          const total = Object.keys(c.presencas || {}).length;
          const presentes = Object.values(c.presencas || {}).filter(Boolean).length;
          return '<li>' + esc(L.fmtCurta(c.data)) + ' · ' + presentes + '/' + total + ' presente(s) · <button class="link" type="button" data-act="editar-chamada" data-turma="' + c.turmaId + '" data-data="' + c.data + '">editar</button></li>';
        }).join('') + '</ul>') : '') +
      (alertas.length ? ('<h2 class="subtitulo">Faltas recorrentes (presença abaixo de 75%)</h2><ul class="lista-log">' +
        alertas.map(function (x) { return '<li><b>' + esc(x.aluno.nome) + '</b> · ' + x.resumo.pct + '% de presença (' + x.resumo.presencas + '/' + x.resumo.total + ')</li>'; }).join('') + '</ul>') : '') +
      (faltasPorAluno.length ? ('<h2 class="subtitulo">Faltas acumuladas no semestre ' + esc(V.semestre) + ' (' + faltasPorAluno.length + ')</h2><ul class="lista-log">' +
        faltasPorAluno.map(function (x) { return '<li><b>' + esc(x.aluno.nome) + '</b> · ' + x.resumo.faltas + ' falta(s) de ' + x.resumo.total + ' aula(s) registrada(s) (' + x.resumo.pct + '% presença)</li>'; }).join('') + '</ul>') : '') +
      '<section class="bloco">' +
      '<h2>Relatório de frequência do mês</h2>' +
      '<div class="filtros">' +
      '<select data-act="fr-mes-relatorio">' + mesesFreq.map(function (m) { return '<option value="' + m + '"' + (V.fMesFrequencia === m ? ' selected' : '') + '>' + esc(nomeMes(m)) + '</option>'; }).join('') + '</select>' +
      '<button class="btn sm" type="button" data-act="exportar-frequencia-csv">Baixar CSV</button>' +
      '<span class="muted">' + relatorioMes.length + ' registro(s) (aluno + turma)</span>' +
      '</div>' +
      (relatorioMes.length ? ('<table class="tabela"><thead><tr><th>Aluno</th><th>Turma</th><th>Presenças</th><th>Faltas</th><th>Total de aulas</th><th>% presença</th></tr></thead><tbody>' +
        relatorioMes.map(function (x) { return '<tr><td>' + esc(x.nome) + '</td><td>' + esc(x.turma) + '</td><td>' + x.presencas + '</td><td>' + x.faltas + '</td><td>' + x.total + '</td><td>' + x.pct + '%</td></tr>'; }).join('') +
        '</tbody></table>') : '<p class="muted">Nenhuma chamada registrada em ' + esc(nomeMes(V.fMesFrequencia)) + '.</p>') +
      '</section>';
  }

  /* ---------- Inadimplência (régua de cobrança) ---------- */
  function cardInadimplencia(a) {
    const temTel = !!a.telefone;
    const cob = a.cobranca || { etapa: 0, enviadoEm: '' };
    const pagamentos = (a.pagamento.pagamentos || []).slice().sort(function (x, y) { return (x.data || '').localeCompare(y.data || ''); });
    const etapasTxt = ['Lembrete', '2º aviso', 'Aviso final'];
    const turmasTxt = (a.turmas || []).map(function (x) { return x.turma; }).join(', ');
    /* Sugestão de etapa pelo tempo de atraso (não decide nada sozinho, só indica): até 7 dias
       sugere o Lembrete, até 15 o 2º aviso, acima disso o Aviso final — só aparece quando a
       etapa já marcada está atrás do que o atraso atual sugere. */
    const diasAtraso = a.pagamento.status === 'atrasado' ? L.diasEmAtraso(a.diaVencimento, HOJE) : null;
    let sugestao = '';
    if (diasAtraso != null && diasAtraso >= 0) {
      const etapaSugerida = diasAtraso <= 7 ? 1 : (diasAtraso <= 15 ? 2 : 3);
      if (etapaSugerida > cob.etapa) {
        sugestao = '<div class="ct-linha"><span class="tag tag-aviso">Atrasado há ' + diasAtraso + ' dia(s)</span> · sugestão: enviar "' + esc(etapasTxt[etapaSugerida - 1]) + '"</div>';
      }
    }
    return '<div class="card-turma">' +
      '<div class="ct-topo"><b>' + esc(a.nome) + '</b>' + pagamentoBadge(a.pagamento.status) + '</div>' +
      '<div class="ct-linha muted">' + esc(turmasTxt || '—') + (a.telefone ? (' · ' + esc(a.telefone)) : '') + '</div>' +
      (a.pagamento.obs ? ('<div class="ct-linha muted">' + esc(a.pagamento.obs) + '</div>') : '') +
      '<div class="campo"><label>Valor em aberto (R$)</label><input type="text" inputmode="decimal" data-act="valor-aberto-aluno" data-id="' + a.id + '" value="' + esc(a.pagamento.valorEmAberto || '') + '" placeholder="Ex.: 207.00"></div>' +
      (cob.etapa ? ('<div class="ct-linha">Última cobrança enviada: <b>' + esc(etapasTxt[cob.etapa - 1] || ('etapa ' + cob.etapa)) + '</b>' + (cob.enviadoEm ? (' · ' + relTempo(cob.enviadoEm)) : '') + '</div>') : '<div class="ct-linha muted">Nenhuma cobrança enviada ainda</div>') +
      sugestao +
      (pagamentos.length ? ('<div class="ct-linha muted">Pagamentos registrados: ' + pagamentos.map(function (p) { return esc(L.fmtCurta(p.data)) + ' ' + esc(fmtReais(p.valor)); }).join(' · ') + '</div>') : '') +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Registrar pagamento parcial/total (R$)</label><input type="text" inputmode="decimal" id="pg-valor-' + a.id + '" placeholder="Ex.: 100.00"></div>' +
      '<div class="campo"><label>Obs. (opcional)</label><input type="text" id="pg-obs-' + a.id + '" placeholder="Ex.: Pix recebido hoje"></div>' +
      '</div>' +
      '<div class="ct-acoes"><button class="btn sm" type="button" data-act="add-pagamento-aluno" data-id="' + a.id + '">Registrar pagamento</button></div>' +
      '<div class="ct-acoes">' +
      (temTel ? [1, 2, 3].map(function (et) {
        const marcada = cob.etapa === et;
        return '<a class="btn sm" target="_blank" rel="noopener" href="' + L.linkWhatsApp(a.telefone, L.mensagemCobranca(a, et)) + '">' + etapasTxt[et - 1] + '</a>' +
          '<button class="btn sm' + (marcada ? ' on-ok' : '') + '" type="button" data-act="cobranca-etapa" data-id="' + a.id + '" data-et="' + et + '">' + (marcada ? '✓ Marcada' : '✓ Marcar como enviada') + '</button>';
      }).join('') : '<span class="muted">Cadastre o telefone do aluno para cobrar por WhatsApp</span>') +
      '</div></div>';
  }
  function viewInadimplencia() {
    const lista = S.alunos.filter(function (a) { return !a.bolsista && !a.cancelado && (a.pagamento.status === 'atrasado' || a.pagamento.status === 'pendente'); })
      .sort(function (a, b) {
        if (a.pagamento.status !== b.pagamento.status) return a.pagamento.status === 'atrasado' ? -1 : 1;
        return L.norm(a.nome).localeCompare(L.norm(b.nome));
      });
    const atrasados = lista.filter(function (a) { return a.pagamento.status === 'atrasado'; });
    const pendentes = lista.filter(function (a) { return a.pagamento.status === 'pendente'; });
    const totalAberto = lista.reduce(function (soma, a) { const v = Number(normalizarValorMoeda(a.pagamento.valorEmAberto)); return soma + (isNaN(v) ? 0 : v); }, 0);
    return '<div class="topo"><h1>Inadimplência</h1><div class="topo-acoes"><a class="btn sm" target="_blank" rel="noopener" href="' + ASAAS_DASHBOARD_URL + '">Abrir Asaas (situação financeira completa)</a></div></div>' +
      '<p class="muted">' + atrasados.length + ' atrasado(s) · ' + pendentes.length + ' pendente(s)' + (totalAberto ? (' · total em aberto informado: ' + fmtReais(totalAberto)) : '') + '</p>' +
      (lista.length ? ('<div class="lista-cards">' + lista.map(cardInadimplencia).join('') + '</div>') : '<p class="muted">Nenhum aluno atrasado ou pendente agora. 🎉</p>');
  }

  /* ---------- Material didático (pedido e entrega por aluno) ---------- */
  function linhaMaterial(m) {
    return '<tr>' +
      '<td><b>' + esc(m.alunoNome) + '</b></td>' +
      '<td><input type="text" data-act="material-campo" data-id="' + m.id + '" data-campo="turmaNome" value="' + esc(m.turmaNome || '') + '" placeholder="Nível/turma"></td>' +
      '<td><input type="date" data-act="material-campo" data-id="' + m.id + '" data-campo="recebidoEm" value="' + esc(m.recebidoEm || '') + '"></td>' +
      '<td><button type="button" class="btn sm' + (m.pagoWashington ? ' on' : '') + '" data-act="material-toggle" data-id="' + m.id + '" data-campo="pagoWashington">' + (m.pagoWashington ? 'Pago' : 'Não pago') + '</button></td>' +
      '<td><input type="date" data-act="material-campo" data-id="' + m.id + '" data-campo="dataEnvio" value="' + esc(m.dataEnvio || '') + '"></td>' +
      '<td><input type="date" data-act="material-campo" data-id="' + m.id + '" data-campo="dataEntrega" value="' + esc(m.dataEntrega || '') + '"></td>' +
      '<td><button type="button" class="btn sm' + (m.entregue ? ' on' : '') + '" data-act="material-toggle" data-id="' + m.id + '" data-campo="entregue">' + (m.entregue ? 'Entregue' : 'Pendente') + '</button></td>' +
      '<td><input type="text" data-act="material-campo" data-id="' + m.id + '" data-campo="obs" value="' + esc(m.obs || '') + '" placeholder="Obs."></td>' +
      '<td><button type="button" class="btn sm" data-act="excluir-material" data-id="' + m.id + '">Excluir</button></td>' +
      '</tr>';
  }
  function viewMaterial() {
    const nm = V.novoMaterial;
    const opcoesAluno = S.alunos.slice().sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    const semBtns = D.semestres.map(function (s) { return '<button class="btn sm' + (V.semestre === s ? ' on' : '') + '" type="button" data-act="semestre" data-s="' + s + '">' + esc(s) + '</button>'; }).join('');
    const lista = S.materiais.filter(function (m) { return m.semestre === V.semestre; })
      .sort(function (a, b) { return L.norm(a.alunoNome).localeCompare(L.norm(b.alunoNome)); });
    const pendentes = lista.filter(function (m) { return !m.entregue; });
    const entregues = lista.filter(function (m) { return m.entregue; });
    const cabecalho = '<thead><tr><th>Aluno</th><th>Nível/turma</th><th>Recebido em</th><th>Pago à Washington</th><th>Data de envio</th><th>Data de entrega</th><th>Entregue</th><th>Obs.</th><th></th></tr></thead>';
    return '<div class="topo"><h1>Material didático</h1><div class="topo-acoes">' + semBtns + '</div></div>' +
      '<section class="bloco">' +
      '<h2>Registrar pedido de material</h2>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Aluno (já cadastrado)</label><select data-act="mat-aluno"><option value="">— Outro / não cadastrado —</option>' +
      opcoesAluno.map(function (a) { return '<option value="' + a.id + '"' + (nm.alunoId === a.id ? ' selected' : '') + '>' + esc(a.nome) + '</option>'; }).join('') + '</select></div>' +
      (!nm.alunoId ? '<div class="campo"><label>Nome do aluno</label><input type="text" data-act="mat-nome" value="' + esc(nm.alunoNome) + '" placeholder="Nome completo"></div>' : '') +
      '<div class="campo"><label>Nível/turma</label><input type="text" data-act="mat-turma" value="' + esc(nm.turmaNome) + '" placeholder="Ex.: Prime 3 (2A)"></div>' +
      '<div class="campo"><label>Semestre</label><input type="text" data-act="mat-semestre" value="' + esc(nm.semestre) + '" placeholder="Ex.: 2026.2"></div>' +
      '<div class="campo"><label>Recebido em (pedido/pagamento)</label><input type="date" data-act="mat-recebido" value="' + esc(nm.recebidoEm) + '"></div>' +
      '</div>' +
      '<div class="check"><label><input type="checkbox" data-act="mat-pago"' + (nm.pagoWashington ? ' checked' : '') + '> Já pagou o material à Washington</label></div>' +
      '<div class="campo"><label>Observação</label><input type="text" data-act="mat-obs" value="' + esc(nm.obs) + '" placeholder="Opcional"></div>' +
      '<button class="btn on" type="button" data-act="add-material">Registrar</button>' +
      '</section>' +
      '<h2 class="subtitulo">Pendentes de entrega (' + pendentes.length + ')</h2>' +
      (pendentes.length ? ('<table class="tabela">' + cabecalho + '<tbody>' + pendentes.map(linhaMaterial).join('') + '</tbody></table>') : '<p class="muted">Nenhum pedido pendente neste semestre.</p>') +
      '<h2 class="subtitulo">Entregues (' + entregues.length + ')</h2>' +
      (entregues.length ? ('<table class="tabela">' + cabecalho + '<tbody>' + entregues.map(linhaMaterial).join('') + '</tbody></table>') : '<p class="muted">Nenhum ainda.</p>');
  }

  /* ---------- Entradas (dinheiro recebido: mensalidades, material, matrícula...) ---------- */
  const FORMAS_PAGAMENTO = ['Pix', 'Boleto', 'Cartão de crédito', 'Cartão de débito', 'Dinheiro', 'Transferência'];
  function mesDeData(d) { return (d || '').slice(0, 7); }
  /* Soma N meses a uma data AAAA-MM-DD (usado pra lançar as parcelas de uma compra parcelada nos
     meses seguintes). Se o dia não existir no mês de destino (ex.: 31 de fevereiro), usa o último
     dia daquele mês. */
  function somarMeses(dataISO, n) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dataISO || '');
    if (!m) return dataISO;
    const ano = Number(m[1]), mesZeroBased = Number(m[2]) - 1, dia = Number(m[3]);
    const total = mesZeroBased + n;
    const novoAno = ano + Math.floor(total / 12);
    const novoMes = ((total % 12) + 12) % 12;
    const ultimoDia = new Date(novoAno, novoMes + 1, 0).getDate();
    const novoDia = Math.min(dia, ultimoDia);
    const pad = function (x) { return String(x).padStart(2, '0'); };
    return novoAno + '-' + pad(novoMes + 1) + '-' + pad(novoDia);
  }
  function nomeMes(ym) {
    if (!/^\d{4}-\d{2}$/.test(ym || '')) return ym || '';
    const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    const p = ym.split('-');
    return MESES[Number(p[1]) - 1] + ' de ' + p[0];
  }
  function mesesDisponiveis(lista) { return Array.from(new Set(lista.map(function (x) { return mesDeData(x.data); }).filter(Boolean))).sort().reverse(); }
  /* Soma o campo "valor" (R$) de uma lista (entradas ou despesas), opcionalmente só de um mês
     específico (AAAA-MM) — usado pra calcular o saldo (entradas − despesas) do período. */
  function totalLista(lista, mesFiltro) {
    const l = mesFiltro ? lista.filter(function (x) { return mesDeData(x.data) === mesFiltro; }) : lista;
    return l.reduce(function (s, x) { const v = Number(normalizarValorMoeda(x.valor)); return s + (isNaN(v) ? 0 : v); }, 0);
  }
  function saldoTag(saldo) { return '<span class="tag ' + (saldo >= 0 ? 'tag-ok' : 'tag-erro') + '">saldo ' + fmtReais(saldo) + '</span>'; }
  /* Despesas marcadas como "a pagar" cuja data já passou (atrasadas) — pra alertar antes que
     passe batido, já que não tinha nenhum aviso pra despesa vencida e ainda não paga. */
  function despesasAtrasadas(conta) { return listaDespesasDoConta(conta).filter(function (d) { return !d.pago && d.data && d.data < HOJE; }); }
  function linhaEntrada(e) {
    return '<tr>' +
      '<td><input type="date" data-act="en-editar-data" data-id="' + e.id + '" value="' + esc(e.data || '') + '"></td>' +
      '<td><b>' + esc(e.alunoNome || '—') + '</b></td>' +
      '<td>' + esc(fmtReais(e.valor) || '—') + '</td>' +
      '<td>' + esc(e.formaPagamento || '—') + '</td>' +
      '<td>' + esc(e.referente || '—') + (e.obs ? ('<div class="muted">' + esc(e.obs) + '</div>') : '') + '</td>' +
      '<td><button type="button" class="btn sm" data-act="excluir-entrada" data-id="' + e.id + '">Excluir</button></td>' +
      '</tr>';
  }
  function viewEntradas() {
    const ne = V.novaEntrada;
    const opcoesAluno = S.alunos.slice().sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    const meses = mesesDisponiveis(S.entradas);
    const lista = (V.fMesEntradas ? S.entradas.filter(function (e) { return mesDeData(e.data) === V.fMesEntradas; }) : S.entradas.slice())
      .sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
    const total = lista.reduce(function (s, e) { const v = Number(normalizarValorMoeda(e.valor)); return s + (isNaN(v) ? 0 : v); }, 0);
    const despesasMesmoPeriodo = totalLista(S.despesas, V.fMesEntradas);
    return '<div class="topo"><h1>Entradas</h1><div class="topo-acoes"><button class="btn sm" type="button" data-act="exportar-entradas-csv">Baixar CSV</button></div></div>' +
      '<section class="bloco">' +
      '<h2>Registrar entrada</h2>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Data</label><input type="date" data-act="en-data" value="' + esc(ne.data) + '"></div>' +
      '<div class="campo"><label>Aluno (já cadastrado)</label><select data-act="en-aluno"><option value="">— Outro / não cadastrado —</option>' +
      opcoesAluno.map(function (a) { return '<option value="' + a.id + '"' + (ne.alunoId === a.id ? ' selected' : '') + '>' + esc(a.nome) + '</option>'; }).join('') + '</select></div>' +
      (!ne.alunoId ? '<div class="campo"><label>Nome (se não for aluno cadastrado)</label><input type="text" data-act="en-nome" value="' + esc(ne.alunoNome) + '" placeholder="Nome"></div>' : '') +
      '<div class="campo"><label>Valor (R$)</label><input type="text" inputmode="decimal" data-act="en-valor" value="' + esc(ne.valor) + '" placeholder="Ex.: 207.00"></div>' +
      '<div class="campo"><label>Forma de pagamento</label><select data-act="en-forma">' + FORMAS_PAGAMENTO.map(function (f) { return '<option value="' + esc(f) + '"' + (ne.formaPagamento === f ? ' selected' : '') + '>' + esc(f) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>Referente a</label><input type="text" list="lista-referente" data-act="en-referente" value="' + esc(ne.referente) + '" placeholder="Ex.: Mensalidade de outubro"></div>' +
      '</div>' +
      '<div class="campo"><label>Observação</label><input type="text" data-act="en-obs" value="' + esc(ne.obs) + '" placeholder="Opcional"></div>' +
      '<datalist id="lista-referente"><option value="Matrícula"><option value="Material Fluent"><option value="Aula particular"></datalist>' +
      '<button class="btn on" type="button" data-act="add-entrada">Registrar</button>' +
      '</section>' +
      '<div class="filtros">' +
      '<select data-act="filtro-mes-entradas"><option value="">Todos os meses</option>' + meses.map(function (m) { return '<option value="' + m + '"' + (V.fMesEntradas === m ? ' selected' : '') + '>' + esc(nomeMes(m)) + '</option>'; }).join('') + '</select>' +
      '<span class="muted">' + lista.length + ' lançamento(s) · total ' + fmtReais(total) + ' · despesas no mesmo período ' + fmtReais(despesasMesmoPeriodo) + '</span> ' + saldoTag(total - despesasMesmoPeriodo) +
      '</div>' +
      (lista.length ? ('<table class="tabela"><thead><tr><th>Data</th><th>Aluno</th><th>Valor</th><th>Forma</th><th>Referente a</th><th></th></tr></thead><tbody>' + lista.map(linhaEntrada).join('') + '</tbody></table>') : '<p class="muted">Nenhuma entrada registrada ainda.</p>');
  }

  /* ---------- Despesas (gastos) ---------- */
  /* Dois "cadernos" de despesas totalmente separados: 'washington' (gastos do curso de inglês,
     dividido com a Camila) e 'unifecaf' (gastos do polo UniFECAF, só da Isabella) — mesma aba/
     mesmas funções, parametrizadas por `conta`, cada um guardado numa lista própria pra não
     misturar os dois nem confundir quem só acompanha um dos dois. */
  const CATEGORIAS_DESPESA = ['Hora Aula', 'Transporte', 'Custos Fixos', 'Limpeza/Descartáveis', 'Mercado', 'Papelaria', 'Salários', 'Equipamentos', 'Ações', 'Metas', 'Outro'];
  function listaDespesasDoConta(conta) { return conta === 'unifecaf' ? S.despesasUnifecaf : S.despesas; }
  function definirListaDespesasDoConta(conta, lista) { if (conta === 'unifecaf') S.despesasUnifecaf = lista; else S.despesas = lista; }
  function chaveLSDespesas(conta) { return conta === 'unifecaf' ? 'despesasUnifecaf' : 'despesas'; }
  function novaDespesaDoConta(conta) { return conta === 'unifecaf' ? V.novaDespesaUnifecaf : V.novaDespesa; }
  function filtroMesDespesasKey(conta) { return conta === 'unifecaf' ? 'fMesDespesasUnifecaf' : 'fMesDespesas'; }
  function contaDoEl(el) { return (el && el.dataset && el.dataset.conta === 'unifecaf') ? 'unifecaf' : 'washington'; }
  function opcoesQuemPagaDespesa(conta) {
    if (conta === 'unifecaf') {
      const vistos = S.despesasUnifecaf.map(function (d) { return d.pagoPor; }).filter(Boolean);
      return Array.from(new Set(['Isabella', 'Conta UniFECAF'].concat(vistos)));
    }
    const profs = S.professores.map(function (p) { return p.nome; });
    return Array.from(new Set(['Isabella', 'Camila', 'Conta do curso'].concat(profs)));
  }
  function linhaDespesa(d, conta) {
    const parcelaTag = d.parcelaTotal ? (' <span class="tag tag-neutro">parcela ' + d.parcelaNum + '/' + d.parcelaTotal + '</span>') : '';
    return '<tr>' +
      '<td><input type="date" data-act="de-editar-data" data-conta="' + conta + '" data-id="' + d.id + '" value="' + esc(d.data || '') + '"></td>' +
      '<td><b>' + esc(d.descricao) + '</b>' + parcelaTag + (d.obs ? ('<div class="muted">' + esc(d.obs) + '</div>') : '') + '</td>' +
      '<td>' + esc(d.categoria || '—') + '</td>' +
      '<td>' + esc(fmtReais(d.valor) || '—') + '</td>' +
      '<td>' + esc(d.pagoPor || '—') + '</td>' +
      '<td><button type="button" class="btn sm' + (d.pago ? ' on' : '') + '" data-act="despesa-toggle" data-conta="' + conta + '" data-id="' + d.id + '">' + (d.pago ? 'Pago' : 'A pagar') + '</button></td>' +
      '<td><button type="button" class="btn sm" data-act="excluir-despesa" data-conta="' + conta + '" data-id="' + d.id + '">Excluir</button>' +
      (d.parcelamentoId ? (' <button type="button" class="btn sm" data-act="excluir-parcelas-restantes" data-conta="' + conta + '" data-grupo="' + esc(d.parcelamentoId) + '">Cancelar parcelas restantes</button>') : '') +
      '</td>' +
      '</tr>';
  }
  /* ---------- Despesas fixas/recorrentes: a gente guarda o "modelo" como a própria despesa mais
     recente marcada como fixa (mesma descrição), e oferece lançar uma cópia dela no mês atual com
     1 clique, em vez de redigitar todo mês. Não deixa lançar 2x no mesmo mês pra não duplicar. ---------- */
  function despesasFixasModelos(conta) {
    const porDescricao = {};
    listaDespesasDoConta(conta).filter(function (d) { return d.fixa; }).forEach(function (d) {
      const chave = L.norm(d.descricao);
      if (!chave) return;
      if (!porDescricao[chave] || (d.data || '') > (porDescricao[chave].data || '')) porDescricao[chave] = d;
    });
    return Object.keys(porDescricao).map(function (k) { return porDescricao[k]; })
      .sort(function (a, b) { return L.norm(a.descricao).localeCompare(L.norm(b.descricao)); });
  }
  function despesaFixaJaLancadaNoMes(modelo, ym, conta) {
    return listaDespesasDoConta(conta).some(function (d) { return L.norm(d.descricao) === L.norm(modelo.descricao) && mesDeData(d.data) === ym; });
  }
  function viewDespesas(conta) {
    conta = conta === 'unifecaf' ? 'unifecaf' : 'washington';
    const nd = novaDespesaDoConta(conta);
    const fMesKey = filtroMesDespesasKey(conta);
    const listaCompleta = listaDespesasDoConta(conta);
    const meses = mesesDisponiveis(listaCompleta);
    const lista = (V[fMesKey] ? listaCompleta.filter(function (d) { return mesDeData(d.data) === V[fMesKey]; }) : listaCompleta.slice())
      .sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
    const total = lista.reduce(function (s, d) { const v = Number(normalizarValorMoeda(d.valor)); return s + (isNaN(v) ? 0 : v); }, 0);
    const entradasMesmoPeriodo = conta === 'washington' ? totalLista(S.entradas, V[fMesKey]) : 0;
    const porCategoria = {};
    lista.forEach(function (d) { const v = Number(normalizarValorMoeda(d.valor)); porCategoria[d.categoria || 'Outro'] = (porCategoria[d.categoria || 'Outro'] || 0) + (isNaN(v) ? 0 : v); });
    const categoriasOrdenadas = Object.keys(porCategoria).sort(function (a, b) { return porCategoria[b] - porCategoria[a]; });
    const mesAtual = mesDeData(HOJE);
    const modelosFixos = despesasFixasModelos(conta);
    const atrasadas = despesasAtrasadas(conta);
    const titulo = conta === 'unifecaf' ? 'Despesas UniFECAF' : 'Despesas';
    return '<div class="topo"><h1>' + esc(titulo) + '</h1><div class="topo-acoes"><button class="btn sm" type="button" data-act="exportar-despesas-csv" data-conta="' + conta + '">Baixar CSV</button></div></div>' +
      (atrasadas.length ? ('<section class="bloco"><h2>⚠️ Despesas atrasadas (' + atrasadas.length + ')</h2>' +
        '<p class="muted">Marcadas como "a pagar" com data já passada · total ' + fmtReais(totalLista(atrasadas)) + '</p>' +
        '<table class="tabela"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Pago por</th><th>Status</th><th></th></tr></thead><tbody>' + atrasadas.map(function (d) { return linhaDespesa(d, conta); }).join('') + '</tbody></table>' +
        '</section>') : '') +
      '<section class="bloco">' +
      '<h2>Registrar despesa' + (conta === 'unifecaf' ? ' (UniFECAF)' : '') + '</h2>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Data</label><input type="date" data-act="de-data" data-conta="' + conta + '" value="' + esc(nd.data) + '"></div>' +
      '<div class="campo"><label>Descrição</label><input type="text" data-act="de-descricao" data-conta="' + conta + '" value="' + esc(nd.descricao) + '" placeholder="Ex.: Aluguel, Mercado…"></div>' +
      '<div class="campo"><label>Categoria</label><select data-act="de-categoria" data-conta="' + conta + '">' + CATEGORIAS_DESPESA.map(function (c) { return '<option value="' + esc(c) + '"' + (nd.categoria === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>' + (nd.parcelado ? 'Valor de cada parcela (R$)' : 'Valor (R$)') + '</label><input type="text" inputmode="decimal" data-act="de-valor" data-conta="' + conta + '" value="' + esc(nd.valor) + '" placeholder="Ex.: 150.00"></div>' +
      '<div class="campo"><label>Pago por</label><input type="text" list="lista-pagopor-' + conta + '" data-act="de-pagopor" data-conta="' + conta + '" value="' + esc(nd.pagoPor) + '" placeholder="' + (conta === 'unifecaf' ? 'Ex.: Isabella, Conta UniFECAF' : 'Ex.: Isabella, Camila, Conta do curso') + '"></div>' +
      '</div>' +
      '<div class="check"><label><input type="checkbox" data-act="de-pago" data-conta="' + conta + '"' + (nd.pago ? ' checked' : '') + '> Já foi pago</label></div>' +
      (nd.parcelado ? '' : ('<div class="check"><label><input type="checkbox" data-act="de-fixa" data-conta="' + conta + '"' + (nd.fixa ? ' checked' : '') + '> Despesa fixa/recorrente (repete todo mês)</label></div>')) +
      '<div class="check"><label><input type="checkbox" data-act="de-parcelado" data-conta="' + conta + '"' + (nd.parcelado ? ' checked' : '') + '> Compra parcelada (lança 1 despesa por mês, nos meses seguintes)</label></div>' +
      (nd.parcelado ? ('<div class="campo"><label>Número de parcelas</label><input type="number" min="2" step="1" data-act="de-parcelas" data-conta="' + conta + '" value="' + esc(nd.parcelas) + '" placeholder="Ex.: 12"></div>') : '') +
      '<div class="campo"><label>Observação</label><input type="text" data-act="de-obs" data-conta="' + conta + '" value="' + esc(nd.obs) + '" placeholder="Opcional"></div>' +
      '<datalist id="lista-pagopor-' + conta + '">' + opcoesQuemPagaDespesa(conta).map(function (q) { return '<option value="' + esc(q) + '">'; }).join('') + '</datalist>' +
      '<button class="btn on" type="button" data-act="add-despesa" data-conta="' + conta + '">Registrar</button>' +
      '</section>' +
      (modelosFixos.length ? ('<section class="bloco"><h2>Despesas fixas (' + modelosFixos.length + ')</h2>' +
        '<p class="muted">Lance de novo em ' + esc(nomeMes(mesAtual)) + ' com 1 clique, sem redigitar.</p>' +
        modelosFixos.map(function (m) {
          const jaLancada = despesaFixaJaLancadaNoMes(m, mesAtual, conta);
          return '<div class="ct-linha">' + esc(m.descricao) + ' · ' + esc(m.categoria || '—') + ' · ' + esc(fmtReais(m.valor) || '—') +
            (jaLancada ? ' <span class="tag tag-ok">Já lançada este mês</span>' : ' <button class="btn sm" type="button" data-act="lancar-despesa-fixa" data-conta="' + conta + '" data-desc="' + esc(m.descricao) + '">Lançar em ' + esc(nomeMes(mesAtual)) + '</button>') +
            '</div>';
        }).join('') + '</section>') : '') +
      '<div class="filtros">' +
      '<select data-act="filtro-mes-despesas" data-conta="' + conta + '"><option value="">Todos os meses</option>' + meses.map(function (m) { return '<option value="' + m + '"' + (V[fMesKey] === m ? ' selected' : '') + '>' + esc(nomeMes(m)) + '</option>'; }).join('') + '</select>' +
      '<span class="muted">' + lista.length + ' lançamento(s) · total ' + fmtReais(total) + (conta === 'washington' ? (' · entradas no mesmo período ' + fmtReais(entradasMesmoPeriodo)) : '') + '</span> ' + (conta === 'washington' ? saldoTag(entradasMesmoPeriodo - total) : '') +
      '</div>' +
      (categoriasOrdenadas.length ? ('<p class="muted">' + categoriasOrdenadas.map(function (c) { return esc(c) + ': ' + fmtReais(porCategoria[c]); }).join(' · ') + '</p>') : '') +
      (lista.length ? ('<table class="tabela"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Pago por</th><th>Status</th><th></th></tr></thead><tbody>' + lista.map(function (d) { return linhaDespesa(d, conta); }).join('') + '</tbody></table>') : '<p class="muted">Nenhuma despesa registrada ainda.</p>');
  }
  function viewDespesasUnifecaf() { return viewDespesas('unifecaf'); }

  /* ---------- Pendências (nada pode passar batido) ---------- */
  function opcoesTurmaSelect(selecionada) {
    return '<option value="">— Sem turma específica —</option>' + S.turmas.slice().sort(function (a, b) { return L.norm(a.turma).localeCompare(L.norm(b.turma)); })
      .map(function (t) { return '<option value="' + t.id + '"' + (selecionada === t.id ? ' selected' : '') + '>' + esc(t.turma) + ' · ' + esc(t.semestre) + '</option>'; }).join('');
  }
  function opcoesAlunoSelect(selecionado) {
    return '<option value="">— Sem aluno específico —</option>' + S.alunos.slice().sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); })
      .map(function (a) { return '<option value="' + a.id + '"' + (selecionado === a.id ? ' selected' : '') + '>' + esc(a.nome) + '</option>'; }).join('');
  }
  function linhaPendencia(p) {
    const a = p.alunoId ? D.alunoPorId[p.alunoId] : null;
    const t = p.turmaId ? D.turmaPorId[p.turmaId] : null;
    const atrasada = !p.resolvida && p.prazo && p.prazo < HOJE;
    return '<div class="pendencia' + (p.resolvida ? ' resolvida' : '') + '">' +
      '<label class="check"><input type="checkbox" data-act="pendencia-toggle" data-id="' + p.id + '"' + (p.resolvida ? ' checked' : '') + '>' +
      '<span><b>' + esc(p.texto) + '</b>' +
      (a || t ? ('<div class="muted" style="font-size:.82rem">' + (a ? esc(a.nome) : '') + (a && t ? ' · ' : '') + (t ? esc(t.turma) : '') + '</div>') : '') +
      '</span></label>' +
      (p.prazo ? ('<span class="tag ' + (atrasada ? 'tag-erro' : 'tag-neutro') + '">prazo ' + esc(L.fmtCurta(p.prazo)) + '</span>') : '') +
      '<button class="btn sm" type="button" data-act="excluir-pendencia" data-id="' + p.id + '">Excluir</button>' +
      '</div>';
  }
  function viewPendencias() {
    const np = V.novaPendencia;
    let lista = S.pendencias.slice();
    if (V.fPendencia === 'abertas') lista = lista.filter(function (p) { return !p.resolvida; });
    lista.sort(function (a, b) { return (a.prazo || '9999').localeCompare(b.prazo || '9999'); });
    const nAbertas = S.pendencias.filter(function (p) { return !p.resolvida; }).length;
    return '<div class="topo"><h1>Pendências</h1></div>' +
      '<p class="muted">Use esta aba para anotar tudo o que precisa ser resolvido na unidade — documento faltando, aluno para ligar, contrato para assinar — para que nada passe batido.</p>' +
      '<section class="bloco">' +
      '<h2>Nova pendência</h2>' +
      '<div class="campo"><label>O que precisa ser feito</label><input type="text" data-act="pend-texto" value="' + esc(np.texto) + '" placeholder="Ex.: Pedir contrato assinado da Maria"></div>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Aluno (opcional)</label><select data-act="pend-aluno">' + opcoesAlunoSelect(np.alunoId) + '</select></div>' +
      '<div class="campo"><label>Turma (opcional)</label><select data-act="pend-turma">' + opcoesTurmaSelect(np.turmaId) + '</select></div>' +
      '<div class="campo"><label>Prazo (opcional)</label><input type="date" data-act="pend-prazo" value="' + esc(np.prazo) + '"></div>' +
      '</div>' +
      '<button class="btn on" type="button" data-act="add-pendencia">Adicionar</button>' +
      '</section>' +
      '<div class="filtros">' +
      '<select data-act="filtro-pendencia"><option value="abertas"' + (V.fPendencia === 'abertas' ? ' selected' : '') + '>Em aberto (' + nAbertas + ')</option><option value="todas"' + (V.fPendencia === 'todas' ? ' selected' : '') + '>Todas (' + S.pendencias.length + ')</option></select>' +
      '</div>' +
      (lista.length ? ('<div class="lista-pendencias">' + lista.map(linhaPendencia).join('') + '</div>') : '<p class="muted">Nenhuma pendência' + (V.fPendencia === 'abertas' ? ' em aberto' : '') + '.</p>');
  }

  /* ---------- Comunicados (mensagens em massa para alunos) ---------- */
  /* Comunicados antigos (sincronizados de antes desta mudança) tinham c.turmaId (uma turma só, ou
     '' para todos). Agora dá pra escolher mais de uma turma de uma vez: c.turmaIds (lista; vazia =
     todos os alunos com WhatsApp). Esta função deixa os dois formatos funcionando. */
  function turmaIdsDoComunicado(c) {
    if (Array.isArray(c.turmaIds)) return c.turmaIds;
    return c.turmaId ? [c.turmaId] : [];
  }
  function alunosDoComunicado(c) {
    const ids = turmaIdsDoComunicado(c);
    if (!ids.length) return S.alunos.filter(function (a) { return a.telefone; });
    const turmas = ids.map(function (id) { return D.turmaPorId[id]; }).filter(Boolean);
    const nomes = {};
    turmas.forEach(function (t) { (t.alunosNomes || []).forEach(function (n) { nomes[L.norm(n.replace(/\s*[\(\*].*$/, '').replace(/\*$/, ''))] = true; }); });
    return S.alunos.filter(function (a) { return a.telefone && nomes[L.norm(a.nome)]; });
  }
  function linhaComunicado(c) {
    const turmas = turmaIdsDoComunicado(c).map(function (id) { return D.turmaPorId[id]; }).filter(Boolean);
    const alunosAlvo = alunosDoComunicado(c);
    const enviados = c.enviados || {};
    const nEnviados = alunosAlvo.filter(function (a) { return enviados[a.id]; }).length;
    const agendado = !!(c.disponivelEm && c.disponivelEm > HOJE);
    return '<div class="bloco"><div class="ct-topo"><b>' + esc(L.fmtCurta(c.data)) + ' · ' + (turmas.length ? esc(turmas.map(function (t) { return t.turma; }).join(', ')) : 'Todos os alunos com WhatsApp') + '</b>' +
      (agendado ? ('<span class="tag tag-aviso">Agendado para ' + esc(L.fmtCurta(c.disponivelEm)) + '</span>') : ('<span class="tag tag-neutro">' + nEnviados + ' / ' + alunosAlvo.length + ' enviado(s)</span>')) +
      (!agendado && alunosAlvo.length ? ('<button class="btn sm" type="button" data-act="copiar-telefones-comunicado" data-id="' + c.id + '">Copiar telefones</button>') : '') +
      '<button class="btn sm" type="button" data-act="excluir-comunicado" data-id="' + c.id + '">Excluir</button></div>' +
      '<p>' + esc(c.mensagem) + '</p>' +
      (agendado ? '<p class="muted">Os botões de envio liberam automaticamente a partir de ' + esc(L.fmtCurta(c.disponivelEm)) + '.</p>' :
        (alunosAlvo.length ? ('<ul class="lista-alunos">' + alunosAlvo.map(function (a) {
          const jaEnviado = !!enviados[a.id];
          return '<li class="aluno-turma-linha"><div>' + esc(a.nome) + (jaEnviado ? ' <span class="tag tag-ok">Enviado</span>' : '') + '</div>' +
            '<div class="aluno-turma-acoes">' +
            '<a class="btn sm" target="_blank" rel="noopener" href="' + L.linkWhatsApp(a.telefone, c.mensagem) + '">Abrir no WhatsApp</a>' +
            '<button class="btn sm' + (jaEnviado ? ' on-ok' : '') + '" type="button" data-act="comunicado-marcar-enviado" data-com="' + c.id + '" data-aluno="' + a.id + '">' + (jaEnviado ? '✓ Enviado' : '✓ Marcar como enviado') + '</button>' +
            '</div></li>';
        }).join('') + '</ul>') : '<p class="muted">Nenhum aluno com telefone cadastrado nessa(s) turma(s).</p>'));
  }
  function viewComunicados() {
    const nc = V.novoComunicado;
    const nm = V.novoModeloComunicado;
    const turmaIds = nc.turmaIds || [];
    const lista = S.comunicados.slice().sort(function (a, b) { return (b.data || '').localeCompare(a.data || '') || (b.id || '').localeCompare(a.id || ''); });
    const agendados = lista.filter(function (c) { return c.disponivelEm && c.disponivelEm > HOJE; });
    const disponiveis = lista.filter(function (c) { return !(c.disponivelEm && c.disponivelEm > HOJE); });
    const modelos = S.modelosComunicado.slice().sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    return '<div class="topo"><h1>Comunicados</h1></div>' +
      '<p class="muted">Escreva um aviso e dispare para todos os alunos de uma ou mais turmas (ou de todas) por WhatsApp, acompanhando quem já recebeu.</p>' +
      '<section class="bloco">' +
      '<h2>Mensagens-modelo</h2>' +
      '<p class="muted">Salve textos usados com frequência (ex.: "aula remarcada", "lembrete de material") pra não redigitar toda vez.</p>' +
      (modelos.length ? ('<ul class="lista-alunos">' + modelos.map(function (m) {
        return '<li class="aluno-turma-linha"><div><b>' + esc(m.nome) + '</b><div class="muted">' + esc(m.texto.length > 80 ? (m.texto.slice(0, 80) + '…') : m.texto) + '</div></div>' +
          '<div class="aluno-turma-acoes">' +
          '<button class="btn sm" type="button" data-act="usar-modelo-comunicado" data-id="' + m.id + '">Usar este modelo</button>' +
          '<button class="btn sm" type="button" data-act="excluir-modelo-comunicado" data-id="' + m.id + '">Excluir</button>' +
          '</div></li>';
      }).join('') + '</ul>') : '<p class="muted">Nenhum modelo salvo ainda.</p>') +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Nome do modelo</label><input type="text" data-act="modelo-nome" value="' + esc(nm.nome) + '" placeholder="Ex.: Aula remarcada"></div>' +
      '</div>' +
      '<div class="campo"><label>Texto do modelo</label><textarea data-act="modelo-texto" rows="2" placeholder="Escreva o texto do modelo…">' + esc(nm.texto) + '</textarea></div>' +
      '<button class="btn sm" type="button" data-act="add-modelo-comunicado">Salvar modelo</button>' +
      '</section>' +
      '<section class="bloco">' +
      '<h2>Novo comunicado</h2>' +
      '<div class="campo"><label>Turmas (deixe tudo desmarcado para todos os alunos com WhatsApp cadastrado)</label>' +
      '<div class="lista-checkboxes-turmas">' + S.turmas.slice().sort(function (a, b) { return L.norm(a.turma).localeCompare(L.norm(b.turma)); }).map(function (t) {
        return '<label class="check"><input type="checkbox" data-act="com-turma-toggle" data-id="' + t.id + '"' + (turmaIds.indexOf(t.id) > -1 ? ' checked' : '') + '> ' + esc(t.turma) + ' · ' + esc(t.semestre) + '</label>';
      }).join('') + '</div></div>' +
      '<div class="campo"><label>Mensagem</label><textarea data-act="com-mensagem" rows="3" placeholder="Escreva o comunicado…">' + esc(nc.mensagem) + '</textarea></div>' +
      '<div class="campo"><label>Agendar envio para (opcional)</label><input type="date" data-act="com-disponivel-em" value="' + esc(nc.disponivelEm || '') + '" min="' + esc(HOJE) + '"></div>' +
      '<p class="muted">Deixe em branco pra poder enviar já. Se agendar, a lista de envio só libera os botões a partir da data escolhida — bom pra deixar o texto pronto sem correr o risco de disparar antes da hora.</p>' +
      '<button class="btn on" type="button" data-act="gerar-comunicado">Gerar lista de envio</button>' +
      '</section>' +
      (agendados.length ? ('<h2 class="subtitulo">Agendados (' + agendados.length + ')</h2>' + agendados.map(linhaComunicado).join('')) : '') +
      (disponiveis.length ? ('<h2 class="subtitulo">Disponíveis pra enviar (' + disponiveis.length + ')</h2>' + disponiveis.map(linhaComunicado).join('')) : (!agendados.length ? '<p class="muted">Nenhum comunicado disparado ainda.</p>' : ''));
  }

  /* ---------- Professores ---------- */
  const TIPOS_OCORRENCIA_PROFESSOR = { falta: 'Falta', reposicao: 'Reposição', substituicao: 'Substituição' };
  function tipoOcorrenciaLabel(t) { return TIPOS_OCORRENCIA_PROFESSOR[t] || t; }
  function ocorrenciasDoProfessor(nome) {
    return S.ocorrenciasProfessor.filter(function (o) { return L.norm(o.professor) === L.norm(nome); })
      .sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
  }
  function horasDoProfessor(nome) {
    return S.horasAula.filter(function (h) { return L.norm(h.professor) === L.norm(nome); })
      .sort(function (a, b) { return (b.semana || '').localeCompare(a.semana || ''); });
  }
  function totalHorasNoMes(nome, ym) {
    return horasDoProfessor(nome).filter(function (h) { return mesDeData(h.semana) === ym; })
      .reduce(function (s, h) { const v = Number(normalizarValorMoeda(h.horas)); return s + (isNaN(v) ? 0 : v); }, 0);
  }
  function viewProfessores() {
    const np = V.novoProfessor;
    const mesAtual = mesDeData(HOJE);
    return '<div class="topo"><h1>Professores</h1></div>' +
      '<section class="bloco">' +
      '<h2>Novo professor</h2>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Nome</label><input type="text" data-act="np-nome" value="' + esc(np.nome) + '" placeholder="Nome completo"></div>' +
      '<div class="campo"><label>Telefone (WhatsApp)</label><input type="text" data-act="np-telefone" value="' + esc(np.telefone) + '" placeholder="(21) 99999-9999"></div>' +
      '</div>' +
      '<button class="btn on" type="button" data-act="add-professor">Adicionar</button>' +
      '</section>' +
      '<div class="lista-cards">' + S.professores.map(function (p, i) {
        const turmasDele = S.turmas.filter(function (t) { return L.norm(t.professor) === L.norm(p.nome); });
        const ocorrencias = ocorrenciasDoProfessor(p.nome);
        const horas = horasDoProfessor(p.nome);
        const totalMes = totalHorasNoMes(p.nome, mesAtual);
        const lancamentoMesAtual = horas.find(function (h) { return mesDeData(h.semana) === mesAtual; });
        return '<div class="card-turma">' +
          '<div class="ct-topo"><b>' + esc(p.nome) + '</b></div>' +
          '<div class="ct-linha">' + turmasDele.length + ' turma(s) no total</div>' +
          '<div class="campo"><label>Telefone (WhatsApp)</label><input type="text" data-act="tel-prof" data-i="' + i + '" value="' + esc(p.telefone || '') + '" placeholder="(21) 99999-9999"></div>' +
          '<div class="campo"><label>Valor da hora-aula (R$)</label><input type="text" inputmode="decimal" data-act="valor-hora-professor" data-i="' + i + '" value="' + esc(p.valorHoraAula || '') + '" placeholder="Ex.: 35.00"></div>' +
          '<div class="ct-acoes">' +
          (p.telefone ? ('<a class="btn sm" target="_blank" rel="noopener" href="' + L.linkWhatsApp(p.telefone, 'Olá, ' + p.nome.split(' ')[0] + '! Aqui é da Washington Ilha.') + '">Chamar no WhatsApp</a>') : '') +
          (ocorrencias.length ? ('<div class="ct-linha muted">' + ocorrencias.length + ' ocorrência(s) recente(s) · <button class="link" type="button" data-act="ir-view" data-view="ocorrencias">ver em Ocorrências</button></div>') : '') +
          '<button class="btn sm" type="button" data-act="excluir-professor" data-i="' + i + '">Excluir professor</button>' +
          '</div>' +
          '<h4>Horas-aula no mês</h4>' +
          '<p class="muted">É o total de horas que ' + esc(p.nome.split(' ')[0]) + ' deu de aula naquele mês — some tudo (semanas, reposições etc.) e lance um número só por mês. Serve pra calcular quanto pagar: horas × valor da hora-aula.</p>' +
          '<p class="muted">Total em ' + esc(nomeMes(mesAtual)) + ': <b>' + totalMes.toLocaleString('pt-BR') + 'h</b>' +
          (p.valorHoraAula ? (' · a pagar: <b>' + esc(fmtReais(totalMes * Number(normalizarValorMoeda(p.valorHoraAula)))) + '</b>') : '') + '</p>' +
          '<div class="campos-matricula">' +
          '<div class="campo"><label>Mês</label><input type="month" id="ha-mes-' + i + '" value="' + mesAtual + '"></div>' +
          '<div class="campo"><label>Total de horas no mês</label><input type="text" inputmode="decimal" id="ha-horas-' + i + '" placeholder="Ex.: 42" value="' + esc(lancamentoMesAtual ? lancamentoMesAtual.horas : '') + '"></div>' +
          '</div>' +
          '<button class="btn sm" type="button" data-act="add-horas-aula" data-prof="' + esc(p.nome) + '" data-i="' + i + '">Salvar total do mês</button>' +
          (horas.length ? ('<ul class="lista-alunos">' + horas.map(function (h) {
            return '<li class="aluno-turma-linha"><div>' + esc(nomeMes(mesDeData(h.semana))) + ' · ' + (h.horas ? ('<b>' + esc(h.horas) + 'h</b>') : '—') + '</div>' +
              '<div class="aluno-turma-acoes"><button class="btn sm" type="button" data-act="excluir-horas-aula" data-id="' + h.id + '">Excluir</button></div></li>';
          }).join('') + '</ul>') : '<p class="muted">Nenhum mês lançado ainda.</p>') +
          '</div>';
      }).join('') + '</div>';
  }

  /* ---------- Ocorrências de professor (faltas/reposições/substituições): aba própria, separada
     de Professores, pra registrar e consultar tudo num lugar só. ---------- */
  function viewOcorrencias() {
    const no = V.novaOcorrenciaProfessor;
    const todasOrdenadas = S.ocorrenciasProfessor.slice().sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
    const lista = V.fProfOcorrencia ? todasOrdenadas.filter(function (o) { return L.norm(o.professor) === L.norm(V.fProfOcorrencia); }) : todasOrdenadas;
    const profsOrdenados = S.professores.slice().sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    return '<div class="topo"><h1>Ocorrências de professores</h1></div>' +
      '<p class="muted">Faltas, reposições e substituições de cada professor, tudo num lugar só.</p>' +
      '<section class="bloco">' +
      '<h2>Registrar ocorrência</h2>' +
      '<div class="campos-matricula">' +
      '<div class="campo"><label>Professor</label><select data-act="oc-professor"><option value="">Selecione…</option>' +
      profsOrdenados.map(function (p) { return '<option value="' + esc(p.nome) + '"' + (no.professor === p.nome ? ' selected' : '') + '>' + esc(p.nome) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>Tipo</label><select data-act="oc-tipo"><option value="falta"' + (no.tipo === 'falta' ? ' selected' : '') + '>Falta</option><option value="reposicao"' + (no.tipo === 'reposicao' ? ' selected' : '') + '>Reposição</option><option value="substituicao"' + (no.tipo === 'substituicao' ? ' selected' : '') + '>Substituição</option></select></div>' +
      '<div class="campo"><label>Data</label><input type="date" data-act="oc-data" value="' + esc(no.data) + '"></div>' +
      '</div>' +
      '<div class="campo"><label>Observação</label><input type="text" data-act="oc-obs" value="' + esc(no.obs) + '" placeholder="Opcional, ex.: turma, motivo…"></div>' +
      '<button class="btn on" type="button" data-act="add-ocorrencia-professor">Registrar</button>' +
      '</section>' +
      '<div class="filtros">' +
      '<select data-act="filtro-prof-ocorrencia"><option value="">Todos os professores</option>' +
      profsOrdenados.map(function (p) { return '<option value="' + esc(p.nome) + '"' + (V.fProfOcorrencia === p.nome ? ' selected' : '') + '>' + esc(p.nome) + '</option>'; }).join('') + '</select>' +
      '<span class="muted">' + lista.length + ' ocorrência(s)</span>' +
      '</div>' +
      (lista.length ? ('<table class="tabela"><thead><tr><th>Data</th><th>Professor</th><th>Tipo</th><th>Observação</th><th></th></tr></thead><tbody>' +
        lista.map(function (o) {
          return '<tr><td>' + esc(L.fmtCurta(o.data)) + '</td><td><b>' + esc(o.professor) + '</b></td><td>' + esc(tipoOcorrenciaLabel(o.tipo)) + '</td><td class="muted">' + esc(o.obs || '—') + '</td>' +
            '<td><button class="btn sm" type="button" data-act="excluir-ocorrencia-professor" data-id="' + o.id + '">Excluir</button></td></tr>';
        }).join('') + '</tbody></table>') : '<p class="muted">Nenhuma ocorrência registrada ainda.</p>');
  }

  /* ---------- Alunos ---------- */
  const MOTIVOS_CANCELAMENTO = ['Mudou de cidade', 'Dificuldade financeira', 'Mudou de horário/turma', 'Concluiu o nível', 'Insatisfação', 'Outro'];
  function pagamentoBadge(st) {
    const cls = { 'em dia': 'tag-ok', atrasado: 'tag-erro', pendente: 'tag-aviso', desconhecido: 'tag-neutro' }[st] || 'tag-neutro';
    return '<span class="tag ' + cls + '">' + esc(st || 'desconhecido') + '</span>';
  }
  /* Bolsista não paga mensalidade e aluno cancelado já saiu — mostrar "desconhecido" ou qualquer
     outro status de pagamento ao lado deles só confunde, então nesses dois casos a gente troca o
     selo de pagamento pela própria tag (Bolsista / Cancelado). */
  function selosPagamentoAluno(a) {
    if (a.cancelado) return '<span class="tag tag-erro">Cancelado</span>';
    if (a.bolsista) return '<span class="tag tag-aviso">Bolsista</span>';
    return pagamentoBadge(a.pagamento.status);
  }
  /* A data de rematrícula não é um campo próprio do aluno: vem do contrato da matrícula mais
     recente dele (contratoFim). Pegamos a matrícula com o contrato que vence mais tarde. */
  function rematriculaInfoAluno(a) {
    const ms = S.matriculas.filter(function (m) { return m.alunoId === a.id && m.contratoFim; });
    if (!ms.length) return null;
    ms.sort(function (x, y) { return (y.contratoFim || '').localeCompare(x.contratoFim || ''); });
    const m = ms[0];
    return { contratoFim: m.contratoFim, dias: L.diasAte(m.contratoFim) };
  }
  function tagRematricula(info) {
    if (!info) return '<span class="tag tag-neutro">sem contrato cadastrado</span>';
    let cls = 'tag-ok', texto = 'rematrícula em ' + esc(L.fmtCurta(info.contratoFim));
    if (info.dias != null) {
      if (info.dias < 0) { cls = 'tag-erro'; texto = 'contrato venceu há ' + Math.abs(info.dias) + ' dia(s) (' + esc(L.fmtCurta(info.contratoFim)) + ')'; }
      else if (info.dias <= 30) { cls = 'tag-aviso'; texto = 'rematrícula em ' + info.dias + ' dia(s) (' + esc(L.fmtCurta(info.contratoFim)) + ')'; }
    }
    return '<span class="tag ' + cls + '">' + texto + '</span>';
  }
  /* ---------- Rematrículas próximas: quem está com o contrato vencendo nos próximos 30 dias
     (ou já vencido e ainda ativo), pra aparecer destacado na aba Alunos em vez de só dentro do
     cadastro de cada um. ---------- */
  function alunosRematriculaProxima() {
    return S.alunos.filter(function (a) { return !alunoEstaCancelado(a); })
      .map(function (a) { return { aluno: a, info: rematriculaInfoAluno(a) }; })
      .filter(function (x) { return x.info && x.info.dias != null && x.info.dias <= 30; })
      .sort(function (x, y) { return x.info.dias - y.info.dias; });
  }
  function cardAlunoRematriculaProxima(x) {
    const a = x.aluno, info = x.info;
    const turma = a.turmas && a.turmas[0];
    const jaEnviada = !!(a.rematricula && a.rematricula.enviada);
    return '<div class="aviso aviso-atencao">' +
      '<p><b>' + esc(a.nome) + '</b> · ' + tagRematricula(info) + (jaEnviada ? ' <span class="tag tag-ok">Mensagem enviada</span>' : '') + '</p>' +
      '<div class="ct-acoes">' +
      '<button class="btn sm" type="button" data-act="ver-aluno" data-id="' + a.id + '">Abrir cadastro</button> ' +
      (a.telefone ? ('<a class="btn sm" target="_blank" rel="noopener" href="' + L.linkWhatsApp(a.telefone, L.mensagemRematricula(a, turma)) + '">Mandar WhatsApp de rematrícula</a>') : '<span class="muted">Sem telefone cadastrado</span>') +
      '<button class="btn sm' + (jaEnviada ? ' on-ok' : '') + '" type="button" data-act="marcar-rematricula" data-id="' + a.id + '">' + (jaEnviada ? '✓ Enviada' : '✓ Marcar como enviada') + '</button>' +
      '</div></div>';
  }
  /* ---------- Aniversariantes próximos: quem faz aniversário nos próximos 30 dias, pra lembrar
     de mandar uma mensagem. Usa a data de nascimento cadastrada na matrícula/cadastro. ---------- */
  function alunosAniversariantesProximos() {
    return S.alunos.filter(function (a) { return !alunoEstaCancelado(a) && a.dataNascimento; })
      .map(function (a) { return { aluno: a, dias: L.diasAteAniversario(a.dataNascimento, HOJE) }; })
      .filter(function (x) { return x.dias != null && x.dias <= 30; })
      .sort(function (x, y) { return x.dias - y.dias; });
  }
  function cardAlunoAniversario(x) {
    const a = x.aluno;
    const quando = x.dias === 0 ? 'hoje! 🎂' : (x.dias === 1 ? 'amanhã' : ('em ' + x.dias + ' dia(s)'));
    const jaEnviado = a.aniversarioUltimoAno === Number(HOJE.slice(0, 4));
    return '<div class="aviso aviso-atencao">' +
      '<p><b>' + esc(a.nome) + '</b> · aniversário ' + quando + ' (' + esc(L.fmtCurta(a.dataNascimento)) + ')' + (jaEnviado ? ' <span class="tag tag-ok">Parabéns enviado</span>' : '') + '</p>' +
      '<div class="ct-acoes">' +
      (a.telefone ? ('<a class="btn sm" target="_blank" rel="noopener" href="' + L.linkWhatsApp(a.telefone, L.mensagemAniversario(a)) + '">Mandar parabéns no WhatsApp</a>') : '<span class="muted">Sem telefone cadastrado</span>') +
      '<button class="btn sm' + (jaEnviado ? ' on-ok' : '') + '" type="button" data-act="marcar-aniversario" data-id="' + a.id + '">' + (jaEnviado ? '✓ Enviado' : '✓ Marcar como enviado') + '</button>' +
      '</div></div>';
  }
  /* ---------- Detecta possíveis alunos duplicados (mesma pessoa cadastrada 2x) ----------
     Isso acontece sobretudo quando um aluno é digitado de novo (com nome incompleto, ex.: só
     "Amanda") numa turma diferente da que ele está de verdade. Critérios, do mais confiável
     pro mais fraco: (1) mesmo telefone cadastrado; (2) nome normalizado idêntico; (3) um nome
     "cabe dentro" do outro (mesmo primeiro nome e todas as palavras do nome menor aparecem no
     nome maior, ex.: "Amanda" dentro de "Amanda Carla de Souza Santana"). */
  function nomeContidoNoOutro(nomeA, nomeB) {
    const tokA = L.norm(nomeA).split(/\s+/).filter(Boolean);
    const tokB = L.norm(nomeB).split(/\s+/).filter(Boolean);
    // Exige pelo menos 2 palavras no nome menor (ex.: "Amanda Carla"), senão um primeiro nome
    // comum (ex.: "Ana") bate com dezenas de alunas "Ana Alguma Coisa" sem ser duplicado nenhum.
    if (tokA.length < 2 || tokB.length < 2 || tokA[0] !== tokB[0]) return false;
    const menor = tokA.length <= tokB.length ? tokA : tokB;
    const maior = tokA.length <= tokB.length ? tokB : tokA;
    if (menor.length === maior.length) return false;
    return menor.every(function (t) { return maior.indexOf(t) > -1; });
  }
  function alunosDuplicadosProvaveis() {
    const idsUsados = {};
    const grupos = [];
    function addGrupo(lista) {
      const novos = lista.filter(function (a) { return !idsUsados[a.id]; });
      if (novos.length < 2) return;
      novos.forEach(function (a) { idsUsados[a.id] = true; });
      grupos.push(novos);
    }
    const porTelefone = {};
    S.alunos.forEach(function (a) {
      const tel = (a.telefone || '').replace(/\D/g, '');
      if (tel.length >= 8) (porTelefone[tel] = porTelefone[tel] || []).push(a);
    });
    Object.keys(porTelefone).forEach(function (k) { addGrupo(porTelefone[k]); });
    const porNome = {};
    S.alunos.forEach(function (a) {
      const n = L.norm(a.nome);
      if (n) (porNome[n] = porNome[n] || []).push(a);
    });
    Object.keys(porNome).forEach(function (k) { addGrupo(porNome[k]); });
    // Um primeiro-e-segundo-nome comum (ex.: "Maria Eduarda") pode "caber dentro" do nome de
    // várias alunas diferentes que não têm nada a ver uma com a outra — aí não é duplicado,
    // é coincidência de nome. Só junta pelo nome quando sobra EXATAMENTE 1 candidato; quando
    // o nome curto bate com 2+ alunos diferentes, é ambíguo demais pra juntar sozinho.
    const restantes = S.alunos.filter(function (a) { return !idsUsados[a.id]; });
    for (let i = 0; i < restantes.length; i++) {
      const a = restantes[i];
      if (idsUsados[a.id]) continue;
      const candidatos = [];
      for (let j = 0; j < restantes.length; j++) {
        if (j === i) continue;
        const b = restantes[j];
        if (!idsUsados[b.id] && nomeContidoNoOutro(a.nome, b.nome)) candidatos.push(b);
      }
      if (candidatos.length === 1) {
        const grupo = [a, candidatos[0]];
        grupo.forEach(function (x) { idsUsados[x.id] = true; });
        grupos.push(grupo);
      }
    }
    const ignorados = S.duplicadosIgnorados || [];
    return grupos.filter(function (g) { return ignorados.indexOf(chaveGrupoDuplicado(g)) === -1; });
  }
  /* Identifica um grupo de "possível duplicado" de forma estável (ids ordenados), pra poder
     marcar esse grupo específico como "não são a mesma pessoa, são irmãos/parentes mesmo" e ele
     parar de aparecer aqui — sem precisar apagar nenhum cadastro. */
  function chaveGrupoDuplicado(grupo) {
    return grupo.map(function (a) { return a.id; }).sort().join(',');
  }
  function cardAlunoDuplicado(grupo) {
    const idsGrupo = grupo.map(function (a) { return a.id; }).join(',');
    const chave = chaveGrupoDuplicado(grupo);
    return '<div class="aviso aviso-atencao dup-card">' +
      '<p><b>Possível aluno duplicado:</b></p>' +
      '<ul>' + grupo.map(function (a) {
        const turmasTxt = (a.turmas || []).map(function (x) { return x.turma + ' (' + x.semestre + ')'; }).join(', ') || 'sem turma';
        return '<li>' + esc(a.nome) + (a.telefone ? (' · ' + esc(a.telefone)) : '') + ' · ' + esc(turmasTxt) + ' · ' + selosPagamentoAluno(a) + '</li>';
      }).join('') + '</ul>' +
      '<div class="dup-acoes">' + grupo.map(function (a) {
        return '<button class="btn sm" type="button" data-act="dup-mesclar" data-manter="' + a.id + '" data-grupo="' + idsGrupo + '">Manter "' + esc(a.nome) + '" e mesclar o(s) outro(s) aqui</button>';
      }).join(' ') +
      ' <button class="btn sm" type="button" data-act="dup-ignorar" data-chave="' + esc(chave) + '">Não são a mesma pessoa (são parentes/homônimos)</button>' +
      '</div>' +
      '</div>';
  }
  /* Linha de totais que aparece em cima das abas Alunos/Cancelados — visão rápida de tamanho da
     base, sem precisar contar ou rolar a tabela. */
  function linhaTotaisAlunos(nAlunosAtivos) {
    return '<div class="stats-topo">' +
      '<div class="stat-tile"><b>' + nAlunosAtivos + '</b><span>aluno(s) ativo(s)</span></div>' +

      '</div>';

  /* ---------- Alunos: tem uma sub-aba "Cancelados" dentro do próprio menu de Alunos (não é mais
     um item separado na barra lateral) — quem já saiu continua no sistema e na(s) turma(s) dele
     (histórico preservado), só não disputa espaço com os ativos na lista principal. ---------- */
  function abasAlunos(nAtivos, nCancelados) {
    return '<div class="semana-modo">' +
      '<button class="btn sm' + (V.alunosAba !== 'cancelados' ? ' on' : '') + '" type="button" data-act="alunos-aba" data-aba="ativos">Ativos (' + nAtivos + ')</button>' +
      '<button class="btn sm' + (V.alunosAba === 'cancelados' ? ' on' : '') + '" type="button" data-act="alunos-aba" data-aba="cancelados">Cancelados (' + nCancelados + ')</button>' +
      '</div>';
  }
  /* Um aluno "saiu" (e por isso vai pra aba Cancelados, não pra Ativos) tanto quando já foi
     efetivamente marcado como cancelado quanto quando só pediu o cancelamento ainda — pra Isa não
     precisar separar as duas coisas na cabeça: pediu pra sair, já sai da lista de Ativos. */
  function alunoEstaCancelado(a) { return !!(a.cancelado || (a.cancelamento && a.cancelamento.solicitado)); }
  function alunosAtivosFiltrados() {
    const ativos = S.alunos.filter(function (a) { return !alunoEstaCancelado(a); });
    let lista = ativos.slice();
    if (V.buscaAluno) {
      const q = L.norm(V.buscaAluno);
      lista = lista.filter(function (a) { return L.norm(a.nome).indexOf(q) > -1; });
    }
    if (V.fPag === 'bolsista') lista = lista.filter(function (a) { return a.bolsista; });
    // Bolsista não entra no filtro por situação de pagamento (em dia/pendente/atrasado/desconhecido)
    // — ele não tem mensalidade pra cobrar, então "desconhecido" não se aplica a ele.
    else if (V.fPag) lista = lista.filter(function (a) { return !a.bolsista && (a.pagamento.status || 'desconhecido') === V.fPag; });
    lista.sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    return lista;
  }
  function alunosCanceladosFiltrados() {
    let lista = S.alunos.filter(alunoEstaCancelado);
    if (V.buscaAlunoCancelado) {
      const q = L.norm(V.buscaAlunoCancelado);
      lista = lista.filter(function (a) { return L.norm(a.nome).indexOf(q) > -1; });
    }
    lista.sort(function (a, b) { return L.norm(a.nome).localeCompare(L.norm(b.nome)); });
    return lista;
  }
  /* Baixa uma lista de linhas como .csv (separador ";", compatível com Excel em pt-BR). */
  function baixarCSV(nomeArquivo, cabecalhos, linhas) {
    function campoCSV(v) {
      const s = String(v == null ? '' : v);
      return /["\n;]/.test(s) ? ('"' + s.replace(/"/g, '""') + '"') : s;
    }
    const conteudo = [cabecalhos].concat(linhas).map(function (linha) { return linha.map(campoCSV).join(';'); }).join('\r\n');
    const blob = new Blob(['﻿' + conteudo], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = nomeArquivo;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

      lista.map(function (a) {

  /* ---------- Buscar ---------- */
  function viewBuscar() {
    const q = L.norm(V.buscaTurma);
    let resTurmas = [], resProf = [], resAlunos = [];
    if (q) {
      resTurmas = S.turmas.filter(function (t) { return L.norm(t.turma + ' ' + t.professor + ' ' + t.sala).indexOf(q) > -1; });
      resProf = S.professores.filter(function (p) { return L.norm(p.nome).indexOf(q) > -1; });
      resAlunos = S.alunos.filter(function (a) { return L.norm(a.nome).indexOf(q) > -1; });
    }
    return '<div class="topo"><h1>Buscar</h1></div>' +
      '<input type="search" placeholder="Buscar turma, professor, sala ou aluno…" value="' + esc(V.buscaTurma) + '" data-act="busca-geral" class="busca-grande">' +
      (q ? (
        '<h2 class="subtitulo">Turmas (' + resTurmas.length + ')</h2><div class="lista-cards">' + resTurmas.map(function (t) { return cardTurma(t); }).join('') + '</div>' +
        '<h2 class="subtitulo">Professores (' + resProf.length + ')</h2><p>' + resProf.map(function (p) { return esc(p.nome); }).join(', ') + '</p>' +
        '<h2 class="subtitulo">Alunos (' + resAlunos.length + ')</h2><p>' + resAlunos.map(function (a) { return '<button class="link" type="button" data-act="ver-aluno" data-id="' + a.id + '">' + esc(a.nome) + '</button>'; }).join(', ') + '</p>'
      ) : '<p class="muted">Digite para buscar.</p>');
  }

  /* ---------- Ações (data-act) ---------- */
  const ACTS = {
    'ir-view': function (el) { V.view = el.dataset.view; render(); },
    'baixar-ics': function (el) { const t = D.turmaPorId[el.dataset.id]; if (t) L.baixarIcsTurma(t); },
    'ver-turma': function (el) { dlgTurma(el.dataset.id); },
    'nova-turma': function () { dlgEditarTurma(null); },
    'editar-turma': function (el) { dlgEditarTurma(el.dataset.id); },
    'salvar-turma': function (el) {
      const nome = $('#et-turma').value.trim();
      const semestre = $('#et-semestre').value.trim();
      if (!nome || !semestre) { toast('Preencha pelo menos o nome da turma e o semestre.'); return; }
      const dados = {
        turma: nome, semestre: semestre, dia: $('#et-dia').value.trim(), horario: $('#et-horario').value.trim(),
        professor: $('#et-professor').value.trim(), sala: $('#et-sala').value.trim(), situacao: $('#et-situacao').value, obs: $('#et-obs').value.trim(),
      };
      let t = el.dataset.id ? D.turmaPorId[el.dataset.id] : null;
      if (t) {
        Object.assign(t, dados);
        registrar('Editou turma', t.turma);
      } else {
        t = Object.assign({ id: proxId('tnovo', S.turmas), alunosNomes: [] }, dados);
        S.turmas.push(t);
        registrar('Criou turma', t.turma);
      }
      LS.set('turmas', S.turmas);
      fecharDlg();
      recalc(); render();
      toast(el.dataset.id ? 'Turma atualizada.' : 'Turma criada.');
    },
    'excluir-turma': function (el) {
      const t = D.turmaPorId[el.dataset.id];
      if (!t) return;
      if (typeof confirm === 'function' && !confirm('Excluir a turma "' + t.turma + '"? Os alunos matriculados nela deixam de tê-la no cadastro (o histórico de matrícula continua guardando o nome da turma).')) return;
      S.turmas = S.turmas.filter(function (x) { return x.id !== t.id; });
      S.alunos.forEach(function (a) { a.turmas = (a.turmas || []).filter(function (x) { return x.turmaId !== t.id; }); });
      LS.set('turmas', S.turmas); LS.set('alunos', S.alunos);
      registrar('Excluiu turma', t.turma);
      fecharDlg();
      recalc(); render();
      toast('Turma excluída.');
    },
    'turma-adicionar-aluno': function (el) {
      const t = D.turmaPorId[el.dataset.turma];
      const sel = $('#add-aluno-turma-select');
      const aluno = sel && sel.value ? D.alunoPorId[sel.value] : null;
      if (!t || !aluno) { toast('Escolha um aluno pra adicionar.'); return; }
      t.alunosNomes = t.alunosNomes || [];
      if ((t.alunosNomes.length >= VAGAS_POR_TURMA) && !t.alunosNomes.some(function (n) { return L.norm(n) === L.norm(aluno.nome); })) {
        toast('Essa turma já está com ' + VAGAS_POR_TURMA + ' alunos (nosso limite por turma). Abra outra turma ou confirme antes de adicionar mais.');
        return;
      }
      aluno.turmas = aluno.turmas || [];
      if (!aluno.turmas.some(function (x) { return x.turmaId === t.id; })) aluno.turmas.push({ turmaId: t.id, semestre: t.semestre, turma: t.turma });
      if (!t.alunosNomes.some(function (n) { return L.norm(n) === L.norm(aluno.nome); })) t.alunosNomes.push(aluno.nome);
      LS.set('alunos', S.alunos); LS.set('turmas', S.turmas);
      registrar('Incluiu aluno na turma', aluno.nome + ' em ' + t.turma);
      recalc();
      dlgTurma(t.id);
      render();
    },
    'turma-remover-aluno': function (el) {
      const t = D.turmaPorId[el.dataset.turma];
      const aluno = D.alunoPorId[el.dataset.aluno];
      if (!t || !aluno) return;
      aluno.turmas = (aluno.turmas || []).filter(function (x) { return x.turmaId !== t.id; });
      t.alunosNomes = (t.alunosNomes || []).filter(function (n) { return L.norm(n.replace(/\s*[\(\*].*$/, '').replace(/\*$/, '')) !== L.norm(aluno.nome); });
      LS.set('alunos', S.alunos); LS.set('turmas', S.turmas);
      registrar('Removeu aluno da turma', aluno.nome + ' de ' + t.turma);
      recalc();
      dlgTurma(t.id);
      render();
    },
    'ver-aluno': function (el) { fecharDlg(); dlgAluno(el.dataset.id); },
    fechar: function () { fecharDlg(); },
    semestre: function (el) { V.semestre = el.dataset.s; render(); },
    'semana-nav': function (el) { const d = Number(el.dataset.d); V.semanaOffset = d === 0 ? 0 : V.semanaOffset + d; render(); },
    'semana-modo': function (el) { V.semanaModo = el.dataset.m; render(); },
    'dia-nav': function (el) { const d = Number(el.dataset.d); V.diaOffsetDias = d === 0 ? 0 : V.diaOffsetDias + d; render(); },
    'mes-nav': function (el) { const d = Number(el.dataset.d); V.mesOffset = d === 0 ? 0 : V.mesOffset + d; render(); },
    'mes-abrir-dia': function (el) {
      const dataISO = el.dataset.data;
      if (!dataISO) return;
      V.diaOffsetDias = L.diasAte(dataISO, HOJE);
      const d = new Date(dataISO + 'T00:00:00');
      const hojeD = new Date(HOJE + 'T00:00:00');
      V.mesOffset = (d.getFullYear() - hojeD.getFullYear()) * 12 + (d.getMonth() - hojeD.getMonth());
      V.semanaModo = 'dia';
      render();
    },
    'semana-prof-toggle': function (el) {
      const nome = el.dataset.prof;
      if (V.semProfsOcultos[nome]) delete V.semProfsOcultos[nome]; else V.semProfsOcultos[nome] = true;
      render();
    },
    'semana-prof-limpar': function () { V.semProfsOcultos = {}; render(); },
    'ir-aba': function (el) { V.view = el.dataset.view; render(); },
    'filtro-sit': function (el) { V.fSit = el.value; render(); },
    'filtro-prof-turma': function (el) { V.fProf = el.value; render(); },
    'filtro-pag': function (el) { V.fPag = el.value; render(); },
    'busca-aluno': function (el) { V.buscaAluno = el.value; render(); },
    'busca-aluno-cancelado': function (el) { V.buscaAlunoCancelado = el.value; render(); },
    'alunos-aba': function (el) { V.alunosAba = el.dataset.aba; render(); },
    'exportar-alunos-csv': function (el) {
      const aba = el.dataset.aba;
      if (aba === 'cancelados') {
        const lista = alunosCanceladosFiltrados();
        const linhas = lista.map(function (a) {
          const turmasTxt = (a.turmas || []).map(function (x) { return x.turma + ' (' + x.semestre + ')'; }).join(', ');
          return [a.nome, a.telefone || '', turmasTxt, (a.cancelamento && a.cancelamento.motivo) || ''];
        });
        baixarCSV('alunos-cancelados.csv', ['Nome', 'Telefone', 'Turmas', 'Motivo do cancelamento'], linhas);
      } else {
        const lista = alunosAtivosFiltrados();
        const linhas = lista.map(function (a) {
          const turmasTxt = (a.turmas || []).map(function (x) { return x.turma + ' (' + x.semestre + ')'; }).join(', ');
          return [a.nome, a.telefone || '', a.email || '', turmasTxt, a.pagamento.status || 'desconhecido', a.rg || '', a.cpf || '', a.dataNascimento || '', a.endereco || '', a.cep || '', a.diaVencimento || ''];
        });
        baixarCSV('alunos-ativos.csv', ['Nome', 'Telefone', 'E-mail', 'Turmas', 'Pagamento', 'RG', 'CPF', 'Data de nascimento', 'Endereço', 'CEP', 'Dia de vencimento'], linhas);
      }
      registrar('Exportou lista de alunos em CSV', aba === 'cancelados' ? 'Cancelados' : 'Ativos');
    },
    'exportar-entradas-csv': function () {
      const lista = (V.fMesEntradas ? S.entradas.filter(function (e) { return mesDeData(e.data) === V.fMesEntradas; }) : S.entradas.slice())
        .sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
      const linhas = lista.map(function (e) { return [e.data || '', e.alunoNome || '', normalizarValorMoeda(e.valor) || '', e.formaPagamento || '', e.referente || '', e.obs || '']; });
      baixarCSV('entradas.csv', ['Data', 'Aluno', 'Valor', 'Forma de pagamento', 'Referente a', 'Observação'], linhas);
      registrar('Exportou Entradas em CSV', V.fMesEntradas ? nomeMes(V.fMesEntradas) : 'todos os meses');
    },
    'exportar-despesas-csv': function (el) {
      const conta = contaDoEl(el);
      const fMesKey = filtroMesDespesasKey(conta);
      const listaCompleta = listaDespesasDoConta(conta);
      const lista = (V[fMesKey] ? listaCompleta.filter(function (d) { return mesDeData(d.data) === V[fMesKey]; }) : listaCompleta.slice())
        .sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
      const linhas = lista.map(function (d) { return [d.data || '', d.descricao || '', d.categoria || '', normalizarValorMoeda(d.valor) || '', d.pagoPor || '', d.pago ? 'Pago' : 'A pagar', d.obs || '']; });
      baixarCSV(conta === 'unifecaf' ? 'despesas-unifecaf.csv' : 'despesas.csv', ['Data', 'Descrição', 'Categoria', 'Valor', 'Pago por', 'Status', 'Observação'], linhas);
      registrar('Exportou Despesas' + (conta === 'unifecaf' ? ' UniFECAF' : '') + ' em CSV', V[fMesKey] ? nomeMes(V[fMesKey]) : 'todos os meses');
    },
    'busca-geral': function (el) { V.buscaTurma = el.value; render(); },
    'tel-prof': function (el) { S.professores[Number(el.dataset.i)].telefone = el.value; LS.set('professores', S.professores); registrar('Editou telefone de professor', S.professores[Number(el.dataset.i)].nome); },
    'valor-hora-professor': function (el) {
      const p = S.professores[Number(el.dataset.i)];
      if (!p) return;
      p.valorHoraAula = normalizarValorMoeda(el.value);
      LS.set('professores', S.professores);
    },
    'np-nome': function (el) { V.novoProfessor.nome = el.value; },
    'np-telefone': function (el) { V.novoProfessor.telefone = el.value; },
    'add-professor': function () {
      const np = V.novoProfessor;
      const nome = (np.nome || '').trim();
      if (!nome) { toast('Informe o nome do professor.'); return; }
      if (S.professores.some(function (p) { return L.norm(p.nome) === L.norm(nome); })) { toast('Já existe um professor com esse nome.'); return; }
      S.professores.push({ nome: nome, telefone: (np.telefone || '').trim(), valorHoraAula: VALOR_HORA_AULA_PADRAO });
      LS.set('professores', S.professores);
      registrar('Incluiu professor', nome);
      V.novoProfessor = { nome: '', telefone: '' };
      toast('Professor incluído.');
      render();
    },
    'excluir-professor': function (el) {
      const i = Number(el.dataset.i);
      const p = S.professores[i];
      if (!p) return;
      const turmasDele = S.turmas.filter(function (t) { return L.norm(t.professor) === L.norm(p.nome); });
      const aviso = turmasDele.length ? (' Atenção: ' + turmasDele.length + ' turma(s) estão com esse nome como professor(a) — elas continuam mostrando o nome, mas ele sai da lista de Professores.') : '';
      if (typeof confirm === 'function' && !confirm('Excluir o professor "' + p.nome + '"?' + aviso)) return;
      S.professores = S.professores.filter(function (x, idx) { return idx !== i; });
      LS.set('professores', S.professores);
      registrar('Excluiu professor', p.nome);
      toast('Professor excluído.');
      render();
    },
